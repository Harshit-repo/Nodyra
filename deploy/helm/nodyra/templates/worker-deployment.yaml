apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "nodyra.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-worker
    spec:
      terminationGracePeriodSeconds: 120
      serviceAccountName: {{ include "nodyra.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "nodyra.podSecurityContext" . | nindent 8 }}
      volumes:
        {{- include "nodyra.scratchVolumes" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "nodyra.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.worker_main"]
          securityContext:
            {{- include "nodyra.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "nodyra.scratchVolumeMounts" . | nindent 12 }}
          env:
            {{- include "nodyra.env" . | nindent 12 }}
            - name: DISPATCH_ROLE
              value: "worker"
            - name: WORKER_LABELS
              value: {{ .Values.worker.labels | quote }}
            {{- if gt (int (.Values.worker.healthPort | default 0)) 0 }}
            - name: WORKER_HEALTH_PORT
              value: {{ .Values.worker.healthPort | quote }}
            {{- end }}
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - app.worker_main
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          {{- if and .Values.startupProbe.enabled (gt (int (.Values.worker.healthPort | default 0)) 0) }}
          # Gates livenessProbe until the worker has finished booting, so a
          # slow dependency wire-up is waited out rather than restarted.
          startupProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.worker.healthPort }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          {{- end }}
          {{- if gt (int (.Values.worker.healthPort | default 0)) 0 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.worker.healthPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
