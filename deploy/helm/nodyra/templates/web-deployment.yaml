apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "nodyra.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
    spec:
      serviceAccountName: {{ include "nodyra.serviceAccountName" . }}
      automountServiceAccountToken: false
      # nginx:alpine ships uid/gid 101 for its worker user. The image's own
      # `user nginx;` directive is a no-op once the master is already non-root
      # (nginx logs one warning and carries on), so serving is unaffected.
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.web.runAsUser | default 101 }}
        runAsGroup: {{ .Values.web.runAsUser | default 101 }}
        fsGroup: {{ .Values.web.runAsUser | default 101 }}
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # nginx writes its pid and proxy/fastcgi scratch files at runtime, so
        # these three paths must stay writable under a read-only root.
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        - name: web
          image: {{ include "nodyra.webImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: VITE_API_PROXY
              value: "http://{{ .Release.Name }}-api:{{ .Values.api.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          securityContext:
            {{- include "nodyra.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "nodyra.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Release.Name }}-web
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
