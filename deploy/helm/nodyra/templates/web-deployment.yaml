apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "nodyra.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
    spec:
      containers:
        - name: web
          image: {{ include "nodyra.webImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: VITE_API_PROXY
              value: "http://{{ .Release.Name }}-api:{{ .Values.api.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "nodyra.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Release.Name }}-web
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
