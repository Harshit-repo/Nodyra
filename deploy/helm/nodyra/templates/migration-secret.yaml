{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-migration-key
  labels:
    {{- include "nodyra.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    # Keep it available for the later migration Job. hook-succeeded would
    # delete a Secret immediately, before the Job can consume it.
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  secret-key: {{ required "secret.key is required when secret.existingSecret is unset" .Values.secret.key | quote }}
{{- end }}
