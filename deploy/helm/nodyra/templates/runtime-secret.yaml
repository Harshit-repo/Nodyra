{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nodyra.secretName" . }}
  labels:
    {{- include "nodyra.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret-key: {{ required "secret.key is required (use a random 32+ byte value)" .Values.secret.key | quote }}
  internal-api-token: {{ required "secret.internalApiToken is required for split dispatch" .Values.secret.internalApiToken | quote }}
  mcp-oauth-client-secret: {{ .Values.secret.mcpOauthClientSecret | quote }}
  postgres-url: {{ required "postgres.url is required" .Values.postgres.url | quote }}
{{- end }}
