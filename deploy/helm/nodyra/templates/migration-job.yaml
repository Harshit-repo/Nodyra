apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "nodyra.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "nodyra.podSecurityContext" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: migrate
          image: {{ include "nodyra.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "nodyra.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command:
            - sh
            - -c
            - cd apps/api && alembic upgrade head
          env:
            # Crypto data migrations must use the same master key as the API.
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret | default (printf "%s-migration-key" .Release.Name) }}
                  key: secret-key
            - name: DATABASE_URL
              # pre-install runs before ordinary chart Secrets exist. Match
              # the API's configured database without depending on that Secret.
              value: {{ required "postgres.url is required" .Values.postgres.url | quote }}
