{{- if .Values.serviceAccount.create }}
# Nodyra never calls the Kubernetes API from the API or worker pods. A
# dedicated ServiceAccount with no mounted token removes the default SA's
# credential from the pod filesystem entirely.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nodyra.serviceAccountName" . }}
  labels:
    {{- include "nodyra.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
