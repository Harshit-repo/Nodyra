apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "nodyra.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: {{ include "nodyra.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "nodyra.podSecurityContext" . | nindent 8 }}
      volumes:
        {{- include "nodyra.scratchVolumes" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "nodyra.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.api.port | quote }}
            # Nodyra decides for itself whether to believe X-Forwarded-For
            # (webhook nodes have a per-node trust_proxy setting). Letting
            # uvicorn rewrite the peer address first would silently defeat
            # that, since it trusts XFF from 127.0.0.1 by default.
            - --no-proxy-headers
          env:
            {{- include "nodyra.env" . | nindent 12 }}
            # Local execution stays on workers; agent/kubernetes pools are
            # dispatched by the control plane that owns their connections.
            - name: DISPATCH_ROLE
              value: "control"
            - name: SCHEDULER_ROLE
              value: "leader"
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          securityContext:
            {{- include "nodyra.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "nodyra.scratchVolumeMounts" . | nindent 12 }}
          {{- if .Values.startupProbe.enabled }}
          # Boot wires dependencies and warms pools before answering readiness.
          # Without this, a slow start is killed by livenessProbe rather than
          # waited out; liveness only begins once startup has succeeded.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "nodyra.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
