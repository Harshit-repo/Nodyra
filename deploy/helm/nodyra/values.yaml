image:
  repository: nodyra
  tag: "0.0.1"
  pullPolicy: IfNotPresent

api:
  replicas: 1
  port: 8000
  authRequired: true
  publicApiUrl: ""
  mcpAuthorizationServerUrl: ""
  mcpOauthIntrospectionUrl: ""
  mcpOauthClientId: ""
  # Exact browser origins, comma separated. Required when auth is enabled.
  corsOrigins: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

worker:
  replicas: 1
  # P1-12 / P1-23: when > 0, the worker starts an HTTP health server on this
  # port and the Deployment gets a corresponding readinessProbe.
  healthPort: 0
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

web:
  replicas: 1
  port: 5173

# External dependencies — point these at your Postgres and Redis.
postgres:
  url: "postgresql+asyncpg://nodyra:nodyra@nodyra-postgres:5432/nodyra"

redis:
  url: "redis://nodyra-redis:6379/0"

secret:
  # Prefer an externally managed Secret with `secret-key` and
  # `internal-api-token` keys. When blank, this chart creates one from the two
  # required values below.
  existingSecret: ""
  key: ""
  internalApiToken: ""
  mcpOauthClientSecret: ""

ingress:
  enabled: false
  className: ""
  host: nodyra.example.com
  # TLS should be enabled for any production deployment.  Session cookies
  # have Secure: true so cookie-based auth silently breaks on plain HTTP.
  # Set to false ONLY for local/development environments.
  tls: true

# Number of trusted reverse proxies in front of the API (V-12).
# When Nodyra runs behind an ingress controller, set this to 1 so the
# rate limiter reads the real client IP from X-Forwarded-For instead of
# the ingress pod IP. 0 = direct connections only (no proxy).
trustedProxyCount: 1
