image:
  repository: nodyra
  tag: "0.1.0"
  # Digest takes precedence over tag for immutable staged promotion.
  digest: ""
  pullPolicy: IfNotPresent

api:
  replicas: 1
  port: 8000
  authRequired: true
  allowRegistration: false
  publicApiUrl: ""
  mcpAuthorizationServerUrl: ""
  mcpOauthIntrospectionUrl: ""
  mcpOauthClientId: ""
  # Exact browser origins, comma separated. Required when auth is enabled.
  corsOrigins: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

worker:
  replicas: 1
  # Comma-separated key=value capability labels advertised by each worker pod.
  # Runs with required_labels only lease to workers that satisfy every label.
  labels: ""
  # P1-12 / P1-23: when > 0, the worker starts an HTTP health server on this
  # port and the Deployment gets a corresponding readinessProbe.
  healthPort: 0
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

runtime:
  # Runtime-to-host supervision. Timeout must be greater than interval.
  heartbeatIntervalSeconds: 15
  heartbeatTimeoutSeconds: 45
  # Live runtimes emitting only heartbeats are retired after this bound.
  # Set 0 to disable for intentionally long single-node workloads.
  noProgressTimeoutSeconds: 900

web:
  replicas: 1
  port: 5173
  # Blank repository defaults to "<image.repository>-web".
  imageRepository: ""
  imageDigest: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Disposable evaluation guardrails. Enable only in a dedicated namespace.
# The lifecycle ConfigMap is a contract for the external namespace reaper;
# Kubernetes does not delete namespaces from an annotation by itself.
evaluation:
  enabled: false
  expiresAt: ""
  maxPods: "8"
  requestsCpu: "2"
  requestsMemory: "4Gi"
  limitsCpu: "4"
  limitsMemory: "8Gi"
  requestsStorage: "5Gi"
  defaultPublicEgress: true
  allowedEgressCidrs: []

# External dependencies — point these at your Postgres and Redis.
postgres:
  url: "postgresql+asyncpg://nodyra:nodyra@nodyra-postgres:5432/nodyra"

redis:
  url: "redis://nodyra-redis:6379/0"

secret:
  # Prefer an externally managed Secret with `secret-key` and
  # `internal-api-token` keys. When blank, this chart creates one from the two
  # required values below.
  existingSecret: ""
  key: ""
  internalApiToken: ""
  mcpOauthClientSecret: ""

ingress:
  enabled: false
  className: ""
  host: nodyra.example.com
  # TLS should be enabled for any production deployment.  Session cookies
  # have Secure: true so cookie-based auth silently breaks on plain HTTP.
  # Set to false ONLY for local/development environments.
  tls: true

# Number of trusted reverse proxies in front of the API (V-12).
# When Nodyra runs behind an ingress controller, set this to 1 so the
# rate limiter reads the real client IP from X-Forwarded-For instead of
# the ingress pod IP. 0 = direct connections only (no proxy).
trustedProxyCount: 1
