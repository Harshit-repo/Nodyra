image:
  repository: noodle
  tag: "0.0.1"
  pullPolicy: IfNotPresent

api:
  replicas: 1
  port: 8000
  authRequired: true
  publicApiUrl: ""
  mcpAuthorizationServerUrl: ""
  mcpOauthIntrospectionUrl: ""
  mcpOauthClientId: ""
  # Exact browser origins, comma separated. Required when auth is enabled.
  corsOrigins: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

worker:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

web:
  replicas: 1
  port: 5173

# External dependencies — point these at your Postgres and Redis.
postgres:
  url: "postgresql+asyncpg://noodle:noodle@noodle-postgres:5432/noodle"

redis:
  url: "redis://noodle-redis:6379/0"

secret:
  # Prefer an externally managed Secret with `secret-key` and
  # `internal-api-token` keys. When blank, this chart creates one from the two
  # required values below.
  existingSecret: ""
  key: ""
  internalApiToken: ""
  mcpOauthClientSecret: ""

ingress:
  enabled: false
  className: ""
  host: noodle.example.com
  tls: false

# Number of trusted reverse proxies in front of the API (V-12).
# When Noodle runs behind an ingress controller, set this to 1 so the
# rate limiter reads the real client IP from X-Forwarded-For instead of
# the ingress pod IP. 0 = direct connections only (no proxy).
trustedProxyCount: 1
