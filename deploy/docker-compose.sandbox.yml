# Overlay enabling sandboxed (container-per-run) execution on the worker.
#
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d
#
# The worker talks to Docker through docker-socket-proxy, not a raw
# /var/run/docker.sock bind. The proxy exposes only the Docker API groups
# needed to build environment images, manage the sandbox bridge network, and
# create/start/stop/log/remove Nodyra-labeled run containers.
# Decision rationale: docs/adr/0002-socket-proxy-sandbox.md.
services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.0
    environment:
      LOG_LEVEL: warning
      POST: "1"
      BUILD: "1"
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "1"
      VERSION: "1"
      AUTH: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EVENTS: "0"
      EXEC: "0"
      GRPC: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    # v0.4.0 renders its HAProxy config under /tmp and PID under /run. Keep the
    # root filesystem immutable while providing only the small, non-executable
    # scratch mounts the entrypoint requires.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
      - /run:rw,noexec,nosuid,size=1m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2375/_ping | grep -q '^OK$'"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  worker:
    environment:
      EXECUTION_SANDBOX: ${EXECUTION_SANDBOX:-auto}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-auto}
      SANDBOX_DOCKER_HOST: ${SANDBOX_DOCKER_HOST:-tcp://docker-socket-proxy:2375}
      # Override with a unique stable value per replica when scaling workers
      # against one daemon; the hostname fallback is stable across restart.
      SANDBOX_OWNER_ID: ${SANDBOX_OWNER_ID:-}
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
