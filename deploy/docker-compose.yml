name: nodyra

services:
  postgres:
    image: postgres:16.14-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_USER: nodyra
      # Override in deploy/.env for any host that is not a private dev box.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nodyra}
      POSTGRES_DB: nodyra
    ports:
      # Loopback-only: host tools (psql) can connect, the network cannot.
      # Services on the compose network reach postgres:5432 directly.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodyra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      # Loopback-only: an unauthenticated Redis must never face the network.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.57@sha256:8f165334f418ca53691ce358c19b4244226ed35c5d18408c5acf305af2065fb9
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0@sha256:e07e325e303e86f4a87a617491e921b579a92da6d404007394757ac910bf9587
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      - jaeger

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nodyra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/.env (min 8 chars)}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nodyra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/.env (min 8 chars)}
      ARTIFACT_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-nodyra-artifacts}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1;
        do sleep 2; done;
        mc mb --ignore-existing "local/$$ARTIFACT_S3_BUCKET"
    depends_on:
      - minio

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
    command:
      - /bin/sh
      - -c
      - >-
        cd apps/api && alembic upgrade head && cd /app
        && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers
    environment:
      # Production posture so runtime_warnings() actually surface via
      # /ops/runtime-mode (default SECRET_KEY, local artifacts, etc.).
      RUNTIME_MODE: production
      DATABASE_URL: postgresql+asyncpg://nodyra:${POSTGRES_PASSWORD:-nodyra}@postgres:5432/nodyra
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      # Control plane: runs are enqueued here and executed by the worker
      # service below. ``control`` keeps that split (the worker still runs all
      # local + docker execution) while ALSO dispatching agent/kubernetes
      # runner pools — their WebSockets terminate on this API replica, so it
      # must be the one that leases their runs. Use ``disabled`` only if you
      # run no agent/kubernetes pools.
      DISPATCH_ROLE: control
      SCHEDULER_ROLE: leader
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      ENABLE_INPROCESS_SCHEDULER: "true"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set (shared API <-> worker secret)}
      USE_SUBPROCESS_RUNNER: "true"
      RUNTIME_HEARTBEAT_INTERVAL_SECONDS: ${RUNTIME_HEARTBEAT_INTERVAL_SECONDS:-15}
      RUNTIME_HEARTBEAT_TIMEOUT_SECONDS: ${RUNTIME_HEARTBEAT_TIMEOUT_SECONDS:-45}
      RUNTIME_NO_PROGRESS_TIMEOUT_SECONDS: ${RUNTIME_NO_PROGRESS_TIMEOUT_SECONDS:-900}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_PROTOCOL: ${OTEL_EXPORTER_PROTOCOL:-http}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      EXECUTION_SANDBOX: ${EXECUTION_SANDBOX:-auto}
      NODYRA_ALLOW_PRIVATE_EGRESS: ${NODYRA_ALLOW_PRIVATE_EGRESS:-0}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-auto}
      ENVS_DIR: /app/envs
      ARTIFACTS_DIR: /app/artifacts
      ARTIFACT_STORAGE_BACKEND: ${ARTIFACT_STORAGE_BACKEND:-s3}
      ARTIFACT_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-nodyra-artifacts}
      ARTIFACT_S3_REGION: ${ARTIFACT_S3_REGION:-us-east-1}
      ARTIFACT_S3_ENDPOINT: ${ARTIFACT_S3_ENDPOINT:-http://minio:9000}
      # Presigned URLs are followed by the browser, which cannot resolve
      # the internal "minio" hostname. Point it at the published port.
      ARTIFACT_S3_PUBLIC_ENDPOINT: ${ARTIFACT_S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_PORT:-9000}}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-nodyra}}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/.env (min 8 chars)}}
      AWS_EC2_METADATA_DISABLED: "true"
      # DATA_DIR: /app/data
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      AUTH_ALLOW_REGISTRATION: ${AUTH_ALLOW_REGISTRATION:-false}
      AUTH_REGISTRATION_ROLE: ${AUTH_REGISTRATION_ROLE:-viewer}
      SECRET_KEY: ${NODYRA_SECRET_KEY:?SECRET_KEY is required for production}
      NODYRA_LICENSE_KEY: ${NODYRA_LICENSE_KEY:-}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      MCP_AUTHORIZATION_SERVER_URL: ${MCP_AUTHORIZATION_SERVER_URL:-}
      MCP_OAUTH_INTROSPECTION_URL: ${MCP_OAUTH_INTROSPECTION_URL:-}
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      SLACK_OAUTH_CLIENT_ID: ${SLACK_OAUTH_CLIENT_ID:-}
      SLACK_OAUTH_CLIENT_SECRET: ${SLACK_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
    ports:
      # Keep internal HTTP local; the public ingress terminates TLS.
      - "${NODYRA_BIND_HOST:-127.0.0.1}:${NODYRA_API_PORT:-8000}:8000"
    volumes:
      - envdata:/app/envs
      - artifactdata:/app/artifacts
      # User data directory: uncomment both lines below to expose a host folder to nodes.
      # Files placed in ./data/ on the host are available at /app/data/ inside the container.
      # - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
    command: ["python", "-m", "app.worker_main"]
    environment:
      RUNTIME_MODE: production
      DATABASE_URL: postgresql+asyncpg://nodyra:${POSTGRES_PASSWORD:-nodyra}@postgres:5432/nodyra
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      DISPATCH_ROLE: worker
      WORKER_LABELS: ${WORKER_LABELS:-}
      USE_SUBPROCESS_RUNNER: "true"
      RUNTIME_HEARTBEAT_INTERVAL_SECONDS: ${RUNTIME_HEARTBEAT_INTERVAL_SECONDS:-15}
      RUNTIME_HEARTBEAT_TIMEOUT_SECONDS: ${RUNTIME_HEARTBEAT_TIMEOUT_SECONDS:-45}
      RUNTIME_NO_PROGRESS_TIMEOUT_SECONDS: ${RUNTIME_NO_PROGRESS_TIMEOUT_SECONDS:-900}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_PROTOCOL: ${OTEL_EXPORTER_PROTOCOL:-http}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      ENVS_DIR: /app/envs
      ARTIFACTS_DIR: /app/artifacts
      ARTIFACT_STORAGE_BACKEND: ${ARTIFACT_STORAGE_BACKEND:-s3}
      ARTIFACT_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-nodyra-artifacts}
      ARTIFACT_S3_REGION: ${ARTIFACT_S3_REGION:-us-east-1}
      ARTIFACT_S3_ENDPOINT: ${ARTIFACT_S3_ENDPOINT:-http://minio:9000}
      # Presigned URLs are followed by the browser, which cannot resolve
      # the internal "minio" hostname. Point it at the published port.
      ARTIFACT_S3_PUBLIC_ENDPOINT: ${ARTIFACT_S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_PORT:-9000}}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-nodyra}}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/.env (min 8 chars)}}
      AWS_EC2_METADATA_DISABLED: "true"
      # DATA_DIR: /app/data
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set (shared API <-> worker secret)}
      SECRET_KEY: ${NODYRA_SECRET_KEY:?SECRET_KEY is required for production}
      NODYRA_LICENSE_KEY: ${NODYRA_LICENSE_KEY:-}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      # --- Sandboxed execution (container-per-run isolation) ---
      # auto uses the sandbox when Docker is reachable; required refuses to
      # start without it. SANDBOX_RUNTIME=auto picks the strongest available
      # runtime (kata > runsc/gVisor > runc).
      EXECUTION_SANDBOX: ${EXECUTION_SANDBOX:-auto}
      NODYRA_ALLOW_PRIVATE_EGRESS: ${NODYRA_ALLOW_PRIVATE_EGRESS:-0}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-auto}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from pathlib import Path; import sys; sys.exit(0 if b'app.worker_main' in Path('/proc/1/cmdline').read_bytes() else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - envdata:/app/envs
      - artifactdata:/app/artifacts
      # User data directory: uncomment to expose a host folder to nodes.
      # - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    environment:
      NODYRA_API_UPSTREAM: api:8000
      NODYRA_MAX_BODY_SIZE: ${NODYRA_MAX_BODY_SIZE:-52m}
    ports:
      - "${NODYRA_BIND_HOST:-127.0.0.1}:${NODYRA_WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  envdata:
  artifactdata:
