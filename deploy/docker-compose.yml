name: nodyra

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nodyra
      POSTGRES_PASSWORD: nodyra
      POSTGRES_DB: nodyra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodyra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nodyra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/.env (min 8 chars)}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
    command:
      - /bin/sh
      - -c
      - >-
        cd apps/api && alembic upgrade head && cd /app
        && uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      # Production posture so runtime_warnings() actually surface via
      # /ops/runtime-mode (default SECRET_KEY, local artifacts, etc.).
      RUNTIME_MODE: production
      DATABASE_URL: postgresql+asyncpg://nodyra:nodyra@postgres:5432/nodyra
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      # Control plane: runs are enqueued here and executed by the worker
      # service below. ``control`` keeps that split (the worker still runs all
      # local + docker execution) while ALSO dispatching agent/kubernetes
      # runner pools — their WebSockets terminate on this API replica, so it
      # must be the one that leases their runs. Use ``disabled`` only if you
      # run no agent/kubernetes pools.
      DISPATCH_ROLE: control
      SCHEDULER_ROLE: leader
      CORS_ORIGINS: http://localhost:5173
      ENABLE_INPROCESS_SCHEDULER: "true"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set (shared API <-> worker secret)}
      USE_SUBPROCESS_RUNNER: "true"
      ENVS_DIR: /app/envs
      ARTIFACTS_DIR: /app/artifacts
      # DATA_DIR: /app/data
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      AUTH_ALLOW_REGISTRATION: ${AUTH_ALLOW_REGISTRATION:-false}
      AUTH_REGISTRATION_ROLE: ${AUTH_REGISTRATION_ROLE:-viewer}
      SECRET_KEY: ${NODYRA_SECRET_KEY:-${NOODLE_SECRET_KEY:?SECRET_KEY is required for production}}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      MCP_AUTHORIZATION_SERVER_URL: ${MCP_AUTHORIZATION_SERVER_URL:-}
      MCP_OAUTH_INTROSPECTION_URL: ${MCP_OAUTH_INTROSPECTION_URL:-}
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      SLACK_OAUTH_CLIENT_ID: ${SLACK_OAUTH_CLIENT_ID:-}
      SLACK_OAUTH_CLIENT_SECRET: ${SLACK_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - envdata:/app/envs
      - artifactdata:/app/artifacts
      # User data directory: uncomment both lines below to expose a host folder to nodes.
      # Files placed in ./data/ on the host are available at /app/data/ inside the container.
      # - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
    command: ["python", "-m", "app.worker_main"]
    environment:
      RUNTIME_MODE: production
      DATABASE_URL: postgresql+asyncpg://nodyra:nodyra@postgres:5432/nodyra
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      DISPATCH_ROLE: worker
      USE_SUBPROCESS_RUNNER: "true"
      ENVS_DIR: /app/envs
      ARTIFACTS_DIR: /app/artifacts
      # DATA_DIR: /app/data
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set (shared API <-> worker secret)}
      SECRET_KEY: ${NODYRA_SECRET_KEY:-${NOODLE_SECRET_KEY:?SECRET_KEY is required for production}}
      # --- Sandboxed execution (container-per-run isolation) ---
      # Uncomment to run each workflow in a disposable hardened container
      # instead of a worker subprocess. Requires the docker.sock volume below.
      # See docs/deployment.md "Sandboxed execution".
      #   auto     = use the sandbox when Docker is reachable, else fall back
      #   required = refuse to start without it (mandatory when
      #              MULTI_TENANCY_ENABLED=true)
      # EXECUTION_SANDBOX: auto
      # Container runtime: auto picks the strongest available
      # (kata > runsc/gVisor > runc). Set explicitly to fail fast when a
      # specific runtime is mandatory.
      # SANDBOX_RUNTIME: auto
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from pathlib import Path; import sys; sys.exit(0 if b'app.worker_main' in Path('/proc/1/cmdline').read_bytes() else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - envdata:/app/envs
      - artifactdata:/app/artifacts
      # User data directory: uncomment to expose a host folder to nodes.
      # - ./data:/app/data
      # Required for EXECUTION_SANDBOX: lets the worker spawn sibling run
      # containers on the host daemon (Docker-out-of-Docker). The worker
      # itself never runs untrusted code — runs execute in the hardened
      # sibling containers it creates.
      # - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
  envdata:
  artifactdata:
