[project]
name = "nodyra-runner"
version = "0.1.0"
description = "Nodyra remote runner agent — registers a machine as a worker and executes workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "websockets>=12", "nodyra-core"]
keywords = ["nodyra", "workflow", "automation", "runner", "agent"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/Harshit-repo/nodyra"
Repository = "https://github.com/Harshit-repo/nodyra"

[project.scripts]
nodyra-runner = "nodyra_runner_agent.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nodyra_runner_agent"]
