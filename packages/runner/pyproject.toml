[project]
name = "noodle-runner"
version = "0.0.1"
description = "Noodle remote runner agent — registers a machine as a worker and executes workflows"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "websockets>=12"]

[project.scripts]
noodle-runner = "noodle_runner_agent.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noodle_runner_agent"]
