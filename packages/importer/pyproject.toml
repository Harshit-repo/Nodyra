[project]
name = "nodyra-importer"
version = "1.0.5"
description = "Nodyra workflow importer: .module.py → WorkflowGraph"
requires-python = ">=3.12"
dependencies = ["nodyra-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nodyra_importer"]
