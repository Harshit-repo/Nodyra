[project]
name = "noodle-exporter"
version = "0.0.1"
description = "Noodle workflow exporter: .py codegen and Docker image packaging"
requires-python = ">=3.12"
dependencies = ["noodle-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noodle_exporter"]
