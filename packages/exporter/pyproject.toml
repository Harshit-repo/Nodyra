[project]
name = "nodyra-exporter"
version = "1.0.3"
description = "Nodyra workflow exporter: .py codegen and Docker image packaging"
requires-python = ">=3.12"
dependencies = ["nodyra-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nodyra_exporter"]
