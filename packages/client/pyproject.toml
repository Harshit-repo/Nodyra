[project]
name = "nodyra-client"
version = "0.2.0"
description = "Python client and CLI for Nodyra - the Python-native workflow automation platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["workflow", "automation", "nodyra", "orchestration", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28,<0.29.0",
    "click>=8.1,<9.0.0",
    "pydantic>=2.0,<3.0.0",
    "rich>=13.0,<16.0.0",
]

[project.scripts]
nodyra = "nodyra_client.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10.0.0",
    "pytest-httpx>=0.32,<0.37.0",
    "pytest-asyncio>=0.25,<2.0.0",
    "ruff>=0.9,<0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nodyra_client"]

[tool.hatch.build.targets.sdist]
include = ["nodyra_client", "README.md", "LICENSE", "tests"]

[project.urls]
Homepage = "https://github.com/Harshit-repo/Nodyra"
Documentation = "https://github.com/Harshit-repo/Nodyra/blob/main/packages/client/README.md"
Changelog = "https://github.com/Harshit-repo/Nodyra/blob/main/CHANGELOG.md"
