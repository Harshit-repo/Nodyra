[project]
name = "nodyra-runtime"
version = "0.0.1"
description = "Nodyra env-runner subprocess server"
requires-python = ">=3.12"
dependencies = ["nodyra-core", "nodyra-nodes", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nodyra_runtime"]
