[project]
name = "noodle-core"
version = "0.0.1"
description = "Noodle execution engine, node SDK, and shared models"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noodle"]
