[project]
name = "noodle-nodes"
version = "0.0.1"
description = "Noodle built-in node library"
requires-python = ">=3.12"
dependencies = [
    "noodle-core",
    "requests>=2.31",
    "jmespath>=1.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "markdown>=3.5",
    "beautifulsoup4>=4.12",
    "jsonschema>=4.21",
    "cryptography>=42.0",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "mcp>=1.9",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# Heavy ML stack used by the Machine Learning nodes (Train Classifier/
# Regressor, Predict, Evaluate, Select Features). Imported lazily so the base
# node library still enumerates without these installed. Install into a
# dedicated environment (the "ML / Data Science" preset).
ml = [
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "joblib>=1.3",
]
storage = [
    "boto3>=1.34",
]
voice = [
    "audioop-lts>=0.2 ; python_version >= '3.13'",
]
deepgram = [
    "deepgram-sdk>=3.0",
]
ollama = [
    "ollama>=0.4",
]
azure-speech = [
    "azure-cognitiveservices-speech>=1.35",
]
huggingface = [
    "huggingface-hub>=0.20",
]
pandas = [
    "pandas>=2.0",
]
numpy = [
    "numpy>=1.26",
]
matplotlib = [
    "matplotlib>=3.8",
]
pydantic-extra = [
    "pydantic>=2.0",
]
opencv = [
    "opencv-python>=4.8",
]
scipy = [
    "scipy>=1.12",
]
spacy = [
    "spacy>=3.7",
]
networkx = [
    "networkx>=3.2",
]
sympy = [
    "sympy>=1.12",
]
zvec = [
    "zvec>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noodle_nodes"]
