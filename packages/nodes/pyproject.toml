[project]
name = "noodle-nodes"
version = "0.0.1"
description = "Noodle built-in node library"
requires-python = ">=3.12"
dependencies = ["noodle-core", "requests>=2.31"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noodle_nodes"]
