[project]
name = "nodyra-nodes"
version = "1.0.3"
description = "Nodyra built-in node library"
requires-python = ">=3.12"
dependencies = [
    "nodyra-core",
    "requests>=2.31,<3.0.0",
    "jmespath>=1.0,<2.0.0",
    "jinja2>=3.1,<4.0.0",
    "pyyaml>=6.0,<7.0.0",
    "markdown>=3.5,<4.0.0",
    "beautifulsoup4>=4.12,<5.0.0",
    "jsonschema>=4.21,<5.0.0",
    "cryptography>=50.0.0,<51.0.0",
    "duckdb>=1.0,<2.0.0",
    "pyarrow>=15.0,<25.0.0",
    "mcp>=1.28.1,<2.0.0",
    "defusedxml>=0.7.1,<0.8.0",
]

[project.optional-dependencies]
# Heavy ML stack used by the Machine Learning nodes (Train Classifier/
# Regressor, Predict, Evaluate, Select Features). Imported lazily so the base
# node library still enumerates without these installed. Install into a
# dedicated environment (the "ML / Data Science" preset).
ml = [
    "scikit-learn>=1.4,<2.0.0",
    "pandas>=2.0,<4.0.0",
    "numpy>=1.26,<3.0.0",
    "joblib>=1.3,<2.0.0",
]
storage = [
    "boto3>=1.34,<2.0.0",
]
voice = [
    "audioop-lts>=0.2 ,<0.3.0; python_version >= '3.13'",
]
deepgram = [
    "deepgram-sdk>=3.0,<8.0.0",
]
ollama = [
    "ollama>=0.4,<0.7.0",
]
azure-speech = [
    "azure-cognitiveservices-speech>=1.35,<2.0.0",
]
huggingface = [
    "huggingface-hub>=0.20,<2.0.0",
]
pandas = [
    "pandas>=2.0,<4.0.0",
]
numpy = [
    "numpy>=1.26,<3.0.0",
]
matplotlib = [
    "matplotlib>=3.8,<4.0.0",
]
pydantic-extra = [
    "pydantic>=2.0,<3.0.0",
]
opencv = [
    "opencv-python>=4.8,<5.0.0",
]
scipy = [
    "scipy>=1.12,<2.0.0",
]
spacy = [
    "spacy>=3.7,<4.0.0",
]
networkx = [
    "networkx>=3.2,<4.0.0",
]
sympy = [
    "sympy>=1.12,<2.0.0",
]
zvec = [
    "zvec>=0.4,<0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nodyra_nodes"]
