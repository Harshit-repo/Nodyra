name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues and the [roadmap section of the
        README](../../README.md#roadmap) before filing. Substantial changes
        should be discussed in an issue before any code is written — see
        [CONTRIBUTING.md](../../CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish that Nodyra makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working. Sketches, API shapes, and node examples welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Workflow editor / UI
        - Execution engine / runtime
        - Nodes & integrations
        - API / SDK / CLI
        - MCP / AI builder
        - Deployment / operations
        - Security / RBAC / credentials
        - Docs
        - Other
