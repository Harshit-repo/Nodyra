name: Release

# V-11: CD pipeline triggered on version tags (vX.Y.Z).
# Builds and pushes signed Docker images to GHCR so every release has an
# immutable, audit-trailable artefact. Helm upgrade instructions reference
# the tag; ArgoCD / manual helm upgrade can consume the pushed image.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/nodyra-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/nodyra-web

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # required for Cosign keyless signing

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract tag version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.python
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        id: build-web
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign API image with Cosign (keyless)
        run: cosign sign --yes ${{ env.IMAGE_API }}@${{ steps.build-api.outputs.digest }}

      - name: Sign Web image with Cosign (keyless)
        run: cosign sign --yes ${{ env.IMAGE_WEB }}@${{ steps.build-web.outputs.digest }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Nodyra ${{ github.ref_name }}

            ### Images

            ```
            docker pull ${{ env.IMAGE_API }}:${{ steps.meta.outputs.version }}
            docker pull ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.version }}
            ```

            ### Helm upgrade

            ```bash
            helm upgrade nodyra deploy/helm/nodyra \
              --set image.repository=${{ env.IMAGE_API }} \
              --set image.tag=${{ steps.meta.outputs.version }}
            ```
