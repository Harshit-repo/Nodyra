name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/nodyra-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/nodyra-web
  IMAGE_RUNNER: ghcr.io/${{ github.repository_owner }}/nodyra-runner

jobs:
  certify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nodyra
          POSTGRES_PASSWORD: nodyra
          POSTGRES_DB: nodyra_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodyra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODYRA_TEST_DATABASE_URL: postgresql+asyncpg://nodyra:nodyra@localhost:5432/nodyra_release
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install locked dependencies
        run: |
          uv lock --check
          uv sync --locked --all-packages
          npm ci --prefix apps/web

      - name: Verify version, templates, scorecard, and static quality
        run: |
          uv run python scripts/check_versions.py --tag "$GITHUB_REF_NAME"
          uv run python scripts/validate_templates.py
          uv run python scripts/evaluate_product_scorecard.py --output product-scorecard-evidence.json
          uv run ruff check .

      - name: Fresh PostgreSQL migration
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://nodyra:nodyra@localhost:5432/nodyra_release
        run: |
          uv run alembic upgrade head
          uv run alembic check

      # The certification suite must run in the same environment ci.yml uses.
      # Without these, settings fall back to the default PostgreSQL DSN, whose
      # database does not exist here, and the run queue and licence lookups
      # fail against a database that was never created. ci.yml sets
      # NODYRA_TEST_DATABASE_URL job-wide; this job creates nodyra_release.
      - name: Python certification suite
        env:
          NODYRA_TEST_DATABASE_URL: postgresql+asyncpg://nodyra:nodyra@localhost:5432/nodyra_release
          DATABASE_URL: postgresql+asyncpg://nodyra:nodyra@localhost:5432/nodyra_release
          REDIS_URL: redis://localhost:6379/0
        run: >-
          uv run pytest --timeout=300 --timeout-method=thread
          --junitxml=pytest-results-release.xml -q

      - name: Python dependency vulnerability gate
        run: uvx pip-audit --skip-editable --format json --output pip-audit-release.json

      - name: Web certification suite
        working-directory: apps/web
        run: |
          set -o pipefail
          npm audit --audit-level=moderate --json > npm-audit-release.json
          npm run typecheck
          npm test 2>&1 | tee web-test-summary.txt
          npm run build

      - name: Engine planning benchmark
        run: >-
          uv run python scripts/benchmark_engine_planning.py
          --output engine-planning-benchmark.json

      # Diagnostic, not a gate. A full Actions artifact-storage quota made
      # this step fail the whole certify job, which skipped release even
      # though certification itself had passed. Losing the evidence copy is
      # a nuisance; blocking a verified release on it is not correct.
      - name: Upload certification evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release-certification-evidence
          path: |
            pytest-results-release.xml
            pip-audit-release.json
            product-scorecard-evidence.json
            engine-planning-benchmark.json
            apps/web/npm-audit-release.json
            apps/web/web-test-summary.txt
            apps/web/dist/bundle-budget-report.json
          if-no-files-found: error
          retention-days: 400

  release:
    needs: certify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract tag version
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          python scripts/check_versions.py --tag "$GITHUB_REF_NAME"

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.python
          push: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        id: build-web
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Runner image
        id: build-runner
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.python
          push: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE_RUNNER }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_RUNNER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4

      - name: Generate API SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_API }}@${{ steps.build-api.outputs.digest }}
          format: spdx-json
          output-file: sbom-api.spdx.json

      - name: Generate Web SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_WEB }}@${{ steps.build-web.outputs.digest }}
          format: spdx-json
          output-file: sbom-web.spdx.json

      - name: Generate Runner SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_RUNNER }}@${{ steps.build-runner.outputs.digest }}
          format: spdx-json
          output-file: sbom-runner.spdx.json

      # anchore/scan-action v7.4.0, pinned to the immutable release commit.
      - name: Scan API SBOM for high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          sbom: sbom-api.spdx.json
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: vulnerability-api.json

      - name: Scan Web SBOM for high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          sbom: sbom-web.spdx.json
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: vulnerability-web.json

      - name: Scan Runner SBOM for high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          sbom: sbom-runner.spdx.json
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: vulnerability-runner.json

      - name: Sign image digests with Cosign
        run: |
          cosign sign --yes ${{ env.IMAGE_API }}@${{ steps.build-api.outputs.digest }}
          cosign sign --yes ${{ env.IMAGE_WEB }}@${{ steps.build-web.outputs.digest }}
          cosign sign --yes ${{ env.IMAGE_RUNNER }}@${{ steps.build-runner.outputs.digest }}

      - name: Attest SBOMs with Cosign
        env:
          API_REF: ${{ env.IMAGE_API }}@${{ steps.build-api.outputs.digest }}
          WEB_REF: ${{ env.IMAGE_WEB }}@${{ steps.build-web.outputs.digest }}
          RUNNER_REF: ${{ env.IMAGE_RUNNER }}@${{ steps.build-runner.outputs.digest }}
        run: |
          cosign attest --yes --type https://spdx.dev/Document --predicate sbom-api.spdx.json "$API_REF"
          cosign attest --yes --type https://spdx.dev/Document --predicate sbom-web.spdx.json "$WEB_REF"
          cosign attest --yes --type https://spdx.dev/Document --predicate sbom-runner.spdx.json "$RUNNER_REF"

      - name: Verify image signatures and SBOM attestations
        env:
          API_REF: ${{ env.IMAGE_API }}@${{ steps.build-api.outputs.digest }}
          WEB_REF: ${{ env.IMAGE_WEB }}@${{ steps.build-web.outputs.digest }}
          RUNNER_REF: ${{ env.IMAGE_RUNNER }}@${{ steps.build-runner.outputs.digest }}
          COSIGN_CERTIFICATE_IDENTITY_REGEXP: ^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$
          COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -o pipefail
          for ref in "$API_REF" "$WEB_REF" "$RUNNER_REF"; do
            cosign verify \
              --certificate-identity-regexp "$COSIGN_CERTIFICATE_IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$COSIGN_CERTIFICATE_OIDC_ISSUER" \
              "$ref"
            cosign verify-attestation \
              --type https://spdx.dev/Document \
              --certificate-identity-regexp "$COSIGN_CERTIFICATE_IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$COSIGN_CERTIFICATE_OIDC_ISSUER" \
              "$ref"
          done 2>&1 | tee cosign-verification.txt

      - name: Download certification evidence
        uses: actions/download-artifact@v8
        with:
          name: release-certification-evidence
          path: certification-evidence

      - name: Build hash-addressed release evidence manifest
        run: |
          python scripts/build_release_evidence.py \
            --version "${{ steps.meta.outputs.version }}" \
            --source-sha "$GITHUB_SHA" \
            --stage internal \
            --image-digest "api=${{ steps.build-api.outputs.digest }}" \
            --image-digest "web=${{ steps.build-web.outputs.digest }}" \
            --image-digest "runner=${{ steps.build-runner.outputs.digest }}" \
            --artifact .release/known-issues.md \
            --artifact .release/rollback.md \
            --artifact .release/upgrade-evidence.json \
            --artifact CHANGELOG.md \
            --artifact certification-evidence/pytest-results-release.xml \
            --artifact certification-evidence/pip-audit-release.json \
            --artifact certification-evidence/product-scorecard-evidence.json \
            --artifact certification-evidence/engine-planning-benchmark.json \
            --artifact certification-evidence/apps/web/npm-audit-release.json \
            --artifact certification-evidence/apps/web/web-test-summary.txt \
            --artifact certification-evidence/apps/web/dist/bundle-budget-report.json \
            --artifact sbom-api.spdx.json \
            --artifact sbom-web.spdx.json \
            --artifact sbom-runner.spdx.json \
            --artifact vulnerability-api.json \
            --artifact vulnerability-web.json \
            --artifact vulnerability-runner.json \
            --artifact cosign-verification.txt \
            --output release-evidence.json

      - name: Create GitHub Release with evidence
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
          files: |
            release-evidence.json
            .release/known-issues.md
            .release/rollback.md
            .release/upgrade-evidence.json
            certification-evidence/**/*
            sbom-*.spdx.json
            vulnerability-*.json
            cosign-verification.txt
          body: |
            ## Nodyra ${{ github.ref_name }}

            Release begins at the **internal** rollout stage. Promote the same
            immutable digests through pilot, canary, and broad only after the
            staged-rollout gates are green.

            ### Images

            ```text
            ${{ env.IMAGE_API }}@${{ steps.build-api.outputs.digest }}
            ${{ env.IMAGE_WEB }}@${{ steps.build-web.outputs.digest }}
            ${{ env.IMAGE_RUNNER }}@${{ steps.build-runner.outputs.digest }}
            ```

            ### Helm upgrade

            ```bash
            helm upgrade nodyra deploy/helm/nodyra \
              --set image.repository=${{ env.IMAGE_API }} \
              --set image.tag=${{ steps.meta.outputs.version }} \
              --atomic --timeout 10m
            ```

            See the attached evidence manifest, SBOMs, vulnerability reports,
            known issues, rollback notes, and certification outputs.
