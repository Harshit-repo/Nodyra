name: Documentation Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', 'brand/homepage/**', 'SECURITY.md', 'scripts/build_docs_site.mjs', 'apps/web/package*.json', 'apps/web/e2e/homepage/**', '.github/workflows/docs-pages.yml']
  pull_request:
    paths: ['docs/**', 'brand/homepage/**', 'SECURITY.md', 'scripts/build_docs_site.mjs', 'apps/web/package*.json', 'apps/web/e2e/homepage/**', '.github/workflows/docs-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: node scripts/build_docs_site.mjs --check
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test --config e2e/homepage/playwright.config.ts
        working-directory: apps/web
      - run: node scripts/build_docs_site.mjs --out .tmp/nodyra-docs-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .tmp/nodyra-docs-site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
