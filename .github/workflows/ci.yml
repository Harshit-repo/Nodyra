name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  # Fast default lane: lint + full suite on SQLite (no external services).
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      # Guard the committed lockfile: fail if uv.lock has drifted from the
      # pyproject files. Without this the Docker build (uv sync --locked) can
      # break on a clean clone while CI's plain `uv sync` silently passes.
      - run: uv lock --check
      - run: uv sync --locked --all-packages
      - name: Product contracts
        run: |
          uv run python scripts/check_versions.py
          uv run python scripts/validate_templates.py
          uv run python scripts/evaluate_product_scorecard.py --output product-scorecard-evidence.json
      - run: uv run ruff check .
      - run: uv run python scripts/check_rename.py
      - name: Engine planning performance budgets
        run: >-
          uv run python scripts/benchmark_engine_planning.py
          --output engine-planning-benchmark.json
      # Planning is the cheap half. This measures the half users wait on:
      # nodes executed per second, and whether node-level concurrency still
      # overlaps (a serialised scheduler blows the concurrency budget 2.5x).
      - name: Engine throughput performance budgets
        run: >-
          uv run python scripts/benchmark_engine_throughput.py
          --output engine-throughput-benchmark.json
      - name: Upload engine throughput trend artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-throughput-benchmark
          path: engine-throughput-benchmark.json
          retention-days: 30
      - name: Upload engine planning trend artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-planning-benchmark
          path: engine-planning-benchmark.json
          retention-days: 30
      # Blocking, not advisory. "Let an agent build your workflow" is the
      # product's sharpest claim, and an advisory check on the sharpest claim
      # is not a check. The default planner is deterministic (no LLM call), so
      # a threshold of 1.0 is stable: any drop is a real regression, not model
      # variance. Every case runs, not a sample.
      - name: AI builder eval
        run: uv run python scripts/ai_builder_eval.py --threshold 1.0
      - name: Queue coverage floor
        run: |
          uv run pytest --timeout=300 --timeout-method=thread \
            --cov=app.services.queue \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -q apps/api/tests/test_run_queue.py
      # --timeout guards against a hung test wedging the whole run (see the
      # event-broker fix); 300s is generous for the subprocess-spawning tests.
      - name: Pytest with retry reporting
        run: |
          set -o pipefail
          uv run pytest --timeout=300 --timeout-method=thread \
            --reruns 1 --reruns-delay 2 -rR \
            --cov=app.services.queue \
            --cov=app.services.runner \
            --cov=app.services.run_persistence \
            --cov=app.services.redaction \
            --cov=app.security \
            --cov=nodyra.engine \
            --cov-report=term-missing \
            --cov-report=xml:coverage-critical.xml \
            --cov-fail-under=70 \
            --junitxml=pytest-results.xml 2>&1 | tee pytest-reruns.log
      - name: Report pytest retries
        if: always()
        run: >-
          uv run python scripts/report_flaky_tests.py
          pytest-reruns.log --junit pytest-results.xml

  # Compatibility lane: exercise the engine, runtime subprocess, exporter,
  # environment API, and representative built-in nodes on the newest
  # supported interpreter. Optional node stacks have their own upstream
  # interpreter support windows (notably spaCy, which has no cp314 build yet).
  python-314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"
      - run: uv lock --check
      - run: uv sync --locked --all-packages
      - name: Python 3.14 compatibility suite
        run: |
          set -o pipefail
          uv run pytest --timeout=300 --timeout-method=thread \
            --reruns 1 --reruns-delay 2 -rR \
            --junitxml=pytest-results-314.xml \
            apps/api/tests/test_environments.py \
            apps/api/tests/test_settings_endpoints.py \
            apps/api/tests/test_sandbox_container_runtime.py \
            packages/core/tests \
            packages/exporter/tests \
            packages/runtime/tests \
            packages/nodes/tests/test_builtin_nodes.py \
            packages/nodes/tests/test_node_requirements.py \
            2>&1 | tee pytest-reruns-314.log
      - name: Report pytest retries
        if: always()
        run: >-
          uv run python scripts/report_flaky_tests.py
          pytest-reruns-314.log --junit pytest-results-314.xml

  # The sandbox transport uses blocking socket reads through the platform
  # executor. Keep the lifecycle suite required on Windows as well as Linux so
  # event-loop and fake-container timing regressions cannot re-enter unnoticed.
  sandbox-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --locked --all-packages
      - name: Sandbox lifecycle and liveness (Windows)
        run: >-
          uv run pytest --timeout=300 --timeout-method=thread -q
          apps/api/tests/test_sandbox_pool.py
          apps/api/tests/test_sandbox_container_runtime.py

  # Real-backend lane: runs the suite against Postgres + Redis so behaviour that
  # SQLite can't model is actually exercised:
  #   * the durable run queue's SELECT ... FOR UPDATE SKIP LOCKED lease path
  #     (SQLite has no row locking, so the concurrency guarantee is untested
  #     there);
  #   * Postgres type/constraint strictness (boolean server defaults, foreign
  #     key enforcement — SQLite leaves FKs off by default);
  #   * a real runtime subprocess executing a workflow end to end.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nodyra
          POSTGRES_PASSWORD: nodyra
          POSTGRES_DB: nodyra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodyra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODYRA_TEST_DATABASE_URL: postgresql+asyncpg://nodyra:nodyra@localhost:5432/nodyra
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - run: uv sync --all-packages

      # Authoritative schema-drift check: the migrations must produce a schema
      # that matches the ORM models on Postgres. SQLite can't reflect FKs /
      # constraints reliably, so this is the source of truth (it caught ALM-1
      # nullable drift and ALM-2 missing FK constraints + index). Runs against a
      # dedicated DB so it never collides with the pytest test database.
      - name: Alembic migration drift check (Postgres, required)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://nodyra:nodyra@localhost:5432/nodyra_alembic
        run: |
          uv run python - <<'PY'
          import asyncio, asyncpg
          async def main():
              conn = await asyncpg.connect(
                  host="localhost", user="nodyra", password="nodyra", database="nodyra"
              )
              try:
                  await conn.execute("CREATE DATABASE nodyra_alembic")
              except asyncpg.DuplicateDatabaseError:
                  pass
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
          uv run alembic upgrade head
          uv run alembic check

      # REQUIRED — verified green on Postgres. Gates the lane.
      #   * test_run_queue: the durable queue incl. the Postgres-only
      #     SKIP LOCKED lease path and RQ-1 worker-burst/lease-reclaim/
      #     dead-letter replay chaos cases (SQLite can't cover those).
      #   * packages/runtime: spawns the `nodyra_runtime` subprocess and runs a
      #     real workflow graph through it end to end.
      - name: Postgres queue + real subprocess (required)
        run: |
          set -o pipefail
          uv run pytest --timeout=300 --timeout-method=thread \
            --reruns 1 --reruns-delay 2 -rR \
            --junitxml=pytest-results-postgres-required.xml \
            apps/api/tests/test_run_queue.py \
            packages/runtime/tests \
            2>&1 | tee pytest-reruns-postgres-required.log
      - name: Report pytest retries — Postgres required lane
        if: always()
        run: >-
          uv run python scripts/report_flaky_tests.py
          pytest-reruns-postgres-required.log
          --junit pytest-results-postgres-required.xml

      # Full API suite on Postgres. Surfaces remaining cross-backend gaps
      # (orphan-row FK violations, async-dispatch ordering sensitivity).
      # Blocking — must pass before merge.
      - name: Full API suite on Postgres
        continue-on-error: false
        run: |
          set -o pipefail
          uv run pytest --timeout=300 --timeout-method=thread \
            --reruns 1 --reruns-delay 2 -rR \
            --junitxml=pytest-results-postgres-api.xml \
            apps/api/tests \
            2>&1 | tee pytest-reruns-postgres-api.log
      - name: Report pytest retries — Postgres API lane
        if: always()
        run: >-
          uv run python scripts/report_flaky_tests.py
          pytest-reruns-postgres-api.log --junit pytest-results-postgres-api.xml

  # Security lane: dependency CVE audit, static security linting, and a scoped
  # type check of the security-critical modules.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      # V-13: pip-audit now blocks merges. Any CVE in a direct or transitive
      # dependency must be addressed (upgrade or explicit ignore with justification).
      # --skip-editable excludes local workspace packages that have no PyPI record.
      - name: pip-audit — dependency CVEs (blocking)
        # uvx runs in its own isolated environment. Audit the application
        # environment explicitly, rather than pip-audit's helper dependencies.
        run: >-
          uvx pip-audit --skip-editable
          --path "$(uv run python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
      - name: bandit — security-critical modules (blocking)
        run: >-
          uvx bandit -ll
          apps/api/app/security.py
          apps/api/app/tenancy.py
          apps/api/app/services/crypto.py
          apps/api/app/services/mcp_client.py
          apps/api/app/services/redaction.py
      - name: bandit — static security lint (advisory)
        continue-on-error: true
        run: >-
          uvx bandit -ll -r
          apps/api/app
          packages/core/nodyra
          packages/nodes/nodyra_nodes
      - name: mypy — security-critical modules (blocking)
        run: >-
          uvx mypy --ignore-missing-imports --follow-imports=skip
          apps/api/app/services/crypto.py
          apps/api/app/services/rate_limit.py
          apps/api/app/logging.py
          apps/api/app/security.py

  container-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build production API image
        run: docker build --pull -f deploy/Dockerfile.python -t nodyra-api:ci .
      - name: Build production web image
        run: docker build --pull -f apps/web/Dockerfile -t nodyra-web:ci apps/web
      # Full commit pin is intentional: mutable Trivy action tags were involved
      # in a 2026 supply-chain incident. v0.36.0 is the post-incident release.
      - name: Scan API image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: nodyra-api:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan web image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: nodyra-web:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: compose config — base
        run: docker compose -f deploy/docker-compose.yml config -q
        env:
          MINIO_ROOT_PASSWORD: ci-placeholder
          INTERNAL_API_TOKEN: ci-placeholder
          NODYRA_SECRET_KEY: ci-placeholder
      - name: compose config — sandbox overlay
        run: >-
          docker compose -f deploy/docker-compose.yml
          -f deploy/docker-compose.sandbox.yml config -q
        env:
          MINIO_ROOT_PASSWORD: ci-placeholder
          INTERNAL_API_TOKEN: ci-placeholder
          NODYRA_SECRET_KEY: ci-placeholder
      - name: helm lint — production baseline
        run: >-
          helm lint deploy/helm/nodyra
          --set api.corsOrigins=https://nodyra.example.com
          --set-string secret.key=ci-secret-key-at-least-32-bytes-long
          --set-string secret.internalApiToken=ci-internal-token
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      # helm lint only proves the templates render. These assert the rendered
      # pods are actually hardened — non-root, read-only rootfs, no mounted
      # service-account token, startup probes, PDBs above one replica.
      - name: Chart security posture
        run: uv run pytest -q apps/api/tests/test_helm_chart_posture.py
      - name: helm lint — disposable evaluation profile
        run: >-
          helm lint deploy/helm/nodyra
          -f deploy/helm/nodyra/values-evaluation.yaml
          --set api.corsOrigins=https://eval.example.com
          --set-string secret.key=ci-secret-key-at-least-32-bytes-long
          --set-string secret.internalApiToken=ci-internal-token
          --set evaluation.expiresAt=2030-01-01T00:00:00Z

  # The documented first run, against the compose file the docs actually name.
  #
  # compose-smoke above starts the stack with -f deploy/docker-compose.sandbox.yml.
  # That overlay mounts a Docker socket, so it has always tested a topology no
  # getting-started reader runs, and it stops after /health/ready and
  # GET /templates without executing anything. Eleven first-run bugs reached a
  # release tag underneath it, six of them making the product unusable out of
  # the box — including a base stack that could not run any workflow at all.
  #
  # This job runs what the guide tells a new user to run, and then behaves like
  # that user: register, create from the starter template, run it, download the
  # artifact, verify its checksum.
  first-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Write deploy/.env the way the guide says
        run: |
          cp deploy/.env.example deploy/.env
          python - <<'PY'
          import re, secrets
          from pathlib import Path
          path = Path("deploy/.env")
          text = path.read_text()
          for key, value in {
              "INTERNAL_API_TOKEN": secrets.token_hex(32),
              "NODYRA_SECRET_KEY": secrets.token_hex(32),
              "MINIO_ROOT_PASSWORD": secrets.token_hex(16),
          }.items():
              text = re.sub(rf"^{key}=.*$", f"{key}={value}", text, count=1, flags=re.M)
          path.write_text(text)
          PY
      - name: Start the base stack only
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: Walk the first-run path
        run: uv run python scripts/first_run_smoke.py --base-url http://localhost:8000
      - name: Diagnose on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml ps
          docker compose -f deploy/docker-compose.yml logs --no-color --tail=200 api worker web
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_REQUIRED: "false"
      POSTGRES_PASSWORD: nodyra
      MINIO_ROOT_USER: nodyra
      MINIO_ROOT_PASSWORD: nodyra-ci-minio-password
      INTERNAL_API_TOKEN: ci-internal-token
      NODYRA_SECRET_KEY: ci-secret-key-at-least-32-bytes-long
      ARTIFACT_STORAGE_BACKEND: s3
      EXECUTION_SANDBOX: required
      SANDBOX_RUNTIME: runc
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      - name: Start compose stack
        run: >-
          docker compose -f deploy/docker-compose.yml
          -f deploy/docker-compose.sandbox.yml up -d --build
      - name: Wait for API readiness
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health/ready; then
              exit 0
            fi
            docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.sandbox.yml ps
            sleep 5
          done
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.sandbox.yml logs --no-color --tail=300 api worker web docker-socket-proxy
          exit 1
      - name: REST smoke
        run: curl -fsS http://localhost:8000/templates >/tmp/nodyra-templates.json
      - name: Demo seed is repeatable
        env:
          DATABASE_URL: postgresql+asyncpg://nodyra:nodyra@localhost:5432/nodyra
        run: |
          uv run python scripts/seed_ai_demo_workflows.py >/tmp/nodyra-demo-first.json
          uv run python scripts/seed_ai_demo_workflows.py >/tmp/nodyra-demo-second.json
      - name: Seed recovery fixture
        env:
          DATABASE_URL: postgresql+asyncpg://nodyra:nodyra@localhost:5432/nodyra
          ARTIFACT_S3_ENDPOINT: http://localhost:9000
          ARTIFACT_S3_BUCKET: nodyra-artifacts
          AWS_ACCESS_KEY_ID: nodyra
          AWS_SECRET_ACCESS_KEY: nodyra-ci-minio-password
        run: uv run python scripts/recovery_fixture.py seed --manifest recovery-manifest.json
      - name: Back up PostgreSQL and object storage
        env:
          ARTIFACT_S3_ENDPOINT: http://localhost:9000
          ARTIFACT_S3_BUCKET: nodyra-artifacts
          AWS_ACCESS_KEY_ID: nodyra
          AWS_SECRET_ACCESS_KEY: nodyra-ci-minio-password
        run: |
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.sandbox.yml exec -T postgres \
            pg_dump -U nodyra -Fc nodyra > recovery.dump
          uv run python scripts/recovery_fixture.py copy-bucket \
            --manifest recovery-manifest.json \
            --source-bucket nodyra-artifacts \
            --target-bucket nodyra-artifacts-restored
      - name: Restore into a clean database and verify
        env:
          DATABASE_URL: postgresql+asyncpg://nodyra:nodyra@localhost:5432/nodyra_restore
          ARTIFACT_S3_ENDPOINT: http://localhost:9000
          ARTIFACT_S3_BUCKET: nodyra-artifacts-restored
          AWS_ACCESS_KEY_ID: nodyra
          AWS_SECRET_ACCESS_KEY: nodyra-ci-minio-password
        run: |
          restore_started=$(date +%s)
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.sandbox.yml exec -T postgres \
            createdb -U nodyra nodyra_restore
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.sandbox.yml exec -T postgres \
            pg_restore -U nodyra -d nodyra_restore --no-owner --no-privileges \
            < recovery.dump
          restore_seconds=$(($(date +%s)-restore_started))
          uv run python scripts/recovery_fixture.py verify \
            --manifest recovery-manifest.json \
            --evidence recovery-evidence.json \
            --restore-seconds "$restore_seconds" \
            --max-rto-seconds 3600
      - name: Upload redacted recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-evidence
          path: recovery-evidence.json
          retention-days: 30
      - name: MCP smoke
        env:
          NODYRA_MCP_URL: http://localhost:8000/mcp
        run: uv run python scripts/mcp_smoke.py --no-token
      - name: Product proof-point demos
        run: uv run python scripts/proof_point_demos.py --base-url http://localhost:8000
      - name: Compose logs
        if: always()
        run: >-
          docker compose -f deploy/docker-compose.yml
          -f deploy/docker-compose.sandbox.yml
          logs --no-color --tail=300 api worker web docker-socket-proxy
      - name: Stop compose stack
        if: always()
        run: >-
          docker compose -f deploy/docker-compose.yml
          -f deploy/docker-compose.sandbox.yml down -v

  sandbox-soak:
    # Heavy Docker lane: run nightly and on demand, not on every PR push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTH_REQUIRED: "false"
      EXECUTION_SANDBOX: required
      SANDBOX_RUNTIME: runc
      POSTGRES_PASSWORD: nodyra
      MINIO_ROOT_USER: nodyra
      MINIO_ROOT_PASSWORD: nodyra-ci-minio-password
      INTERNAL_API_TOKEN: ci-internal-token
      NODYRA_SECRET_KEY: ci-secret-key-at-least-32-bytes-long
      ARTIFACT_STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      - name: Mint short-lived test Pro license
        working-directory: apps/api
        run: |
          uv run python - <<'PY'
          import os

          from tests._license_keys import TEST_PUBLIC_KEY_PEM, pro_key

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("LICENSE_PUBLIC_KEY<<LICENSE_PUBLIC_KEY_EOF\n")
              env.write(TEST_PUBLIC_KEY_PEM)
              env.write("LICENSE_PUBLIC_KEY_EOF\n")
              env.write("NODYRA_LICENSE_KEY<<NODYRA_LICENSE_KEY_EOF\n")
              env.write(pro_key())
              env.write("\nNODYRA_LICENSE_KEY_EOF\n")
          PY
      - name: Start sandbox compose stack
        run: >-
          docker compose -f deploy/docker-compose.yml
          -f deploy/docker-compose.sandbox.yml
          up -d --build --wait --wait-timeout 180 api worker
      - name: Wait for API readiness
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health/ready; then
              exit 0
            fi
            docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.sandbox.yml ps
            sleep 5
          done
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.sandbox.yml logs --no-color --tail=300 api worker docker-socket-proxy
          exit 1
      - name: Sandbox worker-kill soak
        run: >-
          uv run python scripts/soak_test.py
          --base-url http://localhost:8000
          --runs 50
          --cancel-ratio 0.2
          --kill-container nodyra-worker-1
          --restart-api-container nodyra-api-1
          --interrupt-redis-container nodyra-redis-1
          --interrupt-postgres-container nodyra-postgres-1
          --outage-seconds 5
          --exercise-drain
          --sandbox
          --expect-sandbox-mode required
          --max-p95-seconds 240
          --settle-seconds 240
          --report-json sandbox-chaos-evidence.json
      # Chaos proves recovery; this proves the process does not drift. A
      # descriptor leaked once per run is invisible in a 50-run burst and
      # OOM-kills a pod days later with nothing in the metrics to explain it.
      - name: Endurance — sustained load with resource-drift assertions
        run: >-
          uv run python scripts/endurance_test.py
          --base-url http://localhost:8000
          --duration-minutes 10
          --concurrency 4
          --sample-interval-seconds 15
          --report-json endurance-evidence.json
      - name: Upload endurance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: endurance-evidence
          path: endurance-evidence.json
          retention-days: 30
      - name: Upload sandbox chaos evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-chaos-evidence
          path: sandbox-chaos-evidence.json
          retention-days: 30
      - name: Compose logs
        if: always()
        run: >-
          docker compose -f deploy/docker-compose.yml
          -f deploy/docker-compose.sandbox.yml
          logs --no-color --tail=300 api worker docker-socket-proxy
      - name: Stop sandbox compose stack
        if: always()
        run: >-
          docker compose -f deploy/docker-compose.yml
          -f deploy/docker-compose.sandbox.yml
          down -v
      - name: Assert sandbox containers reclaimed
        if: always()
        run: |
          leftovers="$(docker ps -aq \
            --filter 'label=io.nodyra.managed=true' \
            --filter 'label=io.nodyra.kind=sandbox-run')"
          if [ -n "$leftovers" ]; then
            echo "orphaned Nodyra sandbox containers remain after shutdown"
            docker ps -a \
              --filter 'label=io.nodyra.managed=true' \
              --filter 'label=io.nodyra.kind=sandbox-run'
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Critical-path browser smoke: first-user setup -> workflow authoring ->
  # run-and-observe, against a real API (fresh SQLite DB, in-process broker).
  # The e2e launcher (apps/web/e2e/start-api.mjs) migrates then boots uvicorn
  # from the repo-root .venv that `uv sync` creates.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
