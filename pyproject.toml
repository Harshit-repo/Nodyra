[project]
name = "noodle"
version = "0.0.1"
description = "Self-hostable, Python-native workflow automation platform where node logic is pure Python"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/*"]

[tool.uv.sources]
noodle-core = { workspace = true }
noodle-nodes = { workspace = true }
noodle-exporter = { workspace = true }
noodle-runtime = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "**/envs/*",         # uv-built env venvs (apps/api/envs/<env-id>/)
    "**/.venv/*",
    "**/dist/*",
    "**/build/*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "worker", "noodle", "noodle_nodes", "noodle_runtime", "noodle_exporter"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["apps", "packages"]
