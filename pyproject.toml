[project]
name = "noodle"
version = "0.0.1"
description = "Self-hostable, Python-native workflow automation platform where node logic is pure Python"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/*"]

[tool.uv.sources]
noodle-core = { workspace = true }
noodle-nodes = { workspace = true }
noodle-exporter = { workspace = true }
noodle-runtime = { workspace = true }
noodle-importer = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Hard per-test wall-clock cap so a single hanging test (e.g. an event
    # broker waiting on a pub/sub message that never arrives) fails fast in CI
    # instead of wedging the whole run. Enabled via --timeout in the CI lanes.
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    # Postgres async driver for the CI lane that runs the suite against a real
    # Postgres (exercises the durable queue's SELECT ... FOR UPDATE SKIP LOCKED).
    "asyncpg>=0.29",
    "simpleeval>=0.9",
    # Direct-node tests exercise requirement-bearing nodes without building a
    # workflow environment; keep their lightweight/representative extras in CI.
    "boto3>=1.34",
    "pandas>=2.0",
    "xmltodict>=0.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "**/envs/*",         # uv-built env venvs (apps/api/envs/<env-id>/)
    "**/.venv/*",
    "**/dist/*",
    "**/build/*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Ruff's formatter deliberately leaves long strings/URLs intact, so enforcing
# E501 in the separate lint pass makes formatted code fail CI. Exception
# chaining (B904) is advisory here because many node functions intentionally
# replace optional-dependency/import errors with concise operator guidance.
ignore = ["E501", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["app", "noodle", "noodle_nodes", "noodle_runtime", "noodle_exporter"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.File", "fastapi.Header"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["apps", "packages"]
