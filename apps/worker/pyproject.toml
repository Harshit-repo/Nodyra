[project]
name = "noodle-worker"
version = "0.0.1"
description = "Noodle Celery workers and env-runner pool"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.3",
    "redis>=5.0",
    "pydantic-settings>=2.2",
    "noodle-core",
    "noodle-runtime",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
