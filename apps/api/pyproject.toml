[project]
name = "nodyra-api"
version = "1.0.0"
description = "Nodyra API server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<0.137.0",
    "starlette>=1.3.1,<2.0.0",
    "python-multipart>=0.0.30,<0.1.0",
    "python3-saml>=1.16,<2.0.0",
    "uvicorn[standard]>=0.29,<0.48.0",
    "sqlalchemy[asyncio]>=2.0,<3.0.0",
    "asyncpg>=0.29,<0.32.0",
    "alembic>=1.13,<2.0.0",
    "redis>=5.0,<7.0.0",
    "pydantic-settings>=2.2,<3.0.0",
    "croniter>=2.0,<7.0.0",
    "tzlocal>=5.0,<6.0.0",
    "nodyra-core",
    "nodyra-nodes",
    "nodyra-exporter",
    "nodyra-importer",
    "cryptography>=48.0.1,<50.0.0",
    "signxml>=5.0,<6.0.0",
    "psutil>=5.9,<8.0.0",
    "asyncssh>=2.14,<3.0.0",
    "authlib>=1.3,<2.0.0",
    "httpx>=0.27,<0.29.0",
    "jsonschema>=4.21,<5.0.0",
    "packaging>=24,<27.0.0",
    "boto3>=1.34,<2.0.0",
    # Argon2id password hashing (OWASP first choice; memory-hard, unlike PBKDF2).
    "argon2-cffi>=23.1,<26.0.0",
    # Sandboxed execution + docker runner pools (container spawning)
    "docker>=7.0,<8.0.0",
    # A5: OpenTelemetry tracing (API/worker processes only — never user envs)
    "opentelemetry-sdk>=1.30,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0,<1.0.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
kms-aws = ["boto3>=1.34,<2.0.0"]
kms-gcp = ["google-cloud-kms>=2.21,<4.0.0"]
kms-all = ["nodyra-api[kms-aws,kms-gcp]"]
