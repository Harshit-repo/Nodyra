[project]
name = "noodle-api"
version = "0.0.1"
description = "Noodle API server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "pydantic-settings>=2.2",
    "croniter>=2.0",
    "tzlocal>=5.0",
    "noodle-core",
    "noodle-nodes",
    "noodle-exporter",
    "cryptography>=42.0",
    "psutil>=5.9",
    "asyncssh>=2.14",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
