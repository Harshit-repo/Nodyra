<svg width="200" height="200" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nodyra — Pulse Arc mark">
  <rect width="50" height="50" rx="11" fill="#090b10"/>

  <!-- Outer arc: large S-curve sweep (the "flow") -->
  <path d="M10 39 C 10 22, 40 28, 40 11"
        stroke="url(#gb)" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Input node — bold, filled -->
  <circle cx="10" cy="39" r="5" fill="#4c9eff"/>
  <!-- Inner glow ring -->
  <circle cx="10" cy="39" r="5" stroke="#79b6ff" stroke-width="1" opacity="0.4"/>

  <!-- Output node — lighter -->
  <circle cx="40" cy="11" r="3.8" fill="#79b6ff"/>

  <!-- Midpoint accent pulse -->
  <circle cx="25" cy="25" r="2" fill="#ffd479" opacity="0.85"/>

  <defs>
    <linearGradient id="gb" x1="10" y1="39" x2="40" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#4c9eff"/>
      <stop offset="50%"  stop-color="#79b6ff"/>
      <stop offset="100%" stop-color="#c8a6ff"/>
    </linearGradient>
  </defs>
</svg>
