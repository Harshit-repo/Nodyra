a{color:inherit;text-decoration:none}
button{font-family:inherit}
.skip-link{position:absolute;left:12px;top:-60px;z-index:100;background:var(--accent);color:#fff;font-weight:700;font-size:13px;padding:10px 16px;border-radius:8px;transition:top 140ms ease}
.skip-link:focus{top:12px;outline:2px solid #fff;outline-offset:2px}

/* top bar */
.dt-bar{position:sticky;top:0;z-index:60;height:58px;background:rgba(9,11,16,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:14px;padding:0 18px}
.dt-brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand-mark{width:26px;height:26px;border-radius:6px;box-shadow:0 4px 14px -6px rgba(20,86,208,0.65);display:block}
.dt-brand-name{font-family:var(--font-display);font-size:18px;font-weight:800;letter-spacing:-0.04em;color:var(--ink)}
.dt-badge{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-glow);border:1px solid rgba(76,158,255,0.28);border-radius:5px;padding:2px 8px;flex-shrink:0}
.dt-search{position:relative;margin-left:auto;margin-right:6px;width:min(340px,38vw);flex-shrink:1}
.dt-search input{width:100%;font-family:var(--font-sans);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 12px 8px 34px;outline:none;transition:border-color 120ms ease,box-shadow 120ms ease}
.dt-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.dt-search input::placeholder{color:var(--ink-3)}
.dt-search .ds-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;display:flex}
.dt-search .kbd-hint{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-size:10px;color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px;pointer-events:none}
.dt-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.dt-btn{font-size:12.5px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;transition:background 120ms,border-color 120ms,color 120ms;white-space:nowrap}
.dt-btn:hover{background:var(--surface-3);color:var(--ink);border-color:var(--accent-deep)}
.dt-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dt-btn-primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff;border-color:var(--accent-deep)}
.dt-btn-primary:hover{background:linear-gradient(180deg,#93c4ff,var(--accent-2));color:#fff}
.dt-burger{display:none;width:36px;height:36px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;flex-shrink:0}
.dt-burger span{display:block;width:15px;height:2px;border-radius:2px;background:var(--ink-2)}
@media(max-width:900px){.dt-burger{display:flex}.dt-search{width:min(320px,46vw)}.kbd-hint{display:none}}
@media(max-width:560px){.dt-badge{display:none}.dt-actions .gh{display:none}.dt-search{width:auto;flex:1}}
@media(max-width:360px){.dt-actions .dt-btn{display:none}.dt-bar{padding:0 12px}}

/* results dropdown */
.dresults{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:0 24px 60px -20px rgba(0,0,0,0.85);overflow:hidden;display:none;z-index:70}
.dresults.open{display:block}
.dr-item{display:flex;flex-direction:column;gap:1px;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line-2)}
.dr-item:last-child{border-bottom:none}
.dr-item:hover,.dr-item.sel{background:var(--surface-2)}
.dr-title{font-size:13px;font-weight:600;color:var(--ink)}
.dr-title mark{background:transparent;color:var(--accent-2);font-weight:700}
.dr-sub{font-size:11px;color:var(--ink-3);font-family:var(--font-mono)}
.dr-group{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 14px 3px}
.dr-empty{padding:14px;font-size:13px;color:var(--ink-3)}

/* layout */
.dl{display:grid;grid-template-columns:264px minmax(0,1fr);max-width:1440px;margin:0 auto}
@media(min-width:1280px){.dl{grid-template-columns:264px minmax(0,1fr) 210px}}

/* sidebar */
.dside{position:sticky;top:58px;height:calc(100vh - 58px);height:calc(100dvh - 58px);overflow-y:auto;border-right:1px solid var(--line-2);padding:22px 12px 60px;background:rgba(9,11,16,0.5)}
.ds-group{margin-bottom:22px}
.ds-group-label{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-3);padding:0 10px 7px;display:flex;align-items:center;gap:8px}
.ds-group-label::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0.55}
.ds-link{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;color:var(--ink-2);padding:6px 10px;border-radius:7px;transition:background 110ms,color 110ms}
.ds-link:hover{background:var(--surface-2);color:var(--ink)}
.ds-link:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ds-link.active{background:var(--accent-glow);color:var(--accent-2);font-weight:600}
.ds-link .ds-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);opacity:0.55;flex-shrink:0}
.ds-link.active .ds-dot{background:var(--accent);opacity:1;box-shadow:0 0 8px rgba(76,158,255,0.7)}
.ds-foot{margin-top:26px;padding:12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-size:11.5px;color:var(--ink-3);line-height:1.6}
.ds-foot a{color:var(--accent);font-weight:600}
.ds-foot a:hover{text-decoration:underline}

/* content */
.dcontent{padding:44px 52px 90px;min-width:0;max-width:860px}
@media(max-width:900px){.dcontent{padding:32px 26px 80px}}
.dcrumb{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.dcrumb a:hover{color:var(--accent)}
.dcrumb .sep{opacity:0.5}
.dcrumb .here{color:var(--ink-2)}
.dpage-title{font-family:var(--font-display);font-size:clamp(30px,4vw,42px);font-weight:800;letter-spacing:-0.03em;line-height:1.05;margin-bottom:10px;text-wrap:balance}
.dpage-desc{font-size:16px;color:var(--ink-2);max-width:60ch;line-height:1.65;margin-bottom:30px}
.dsec{margin-top:44px;scroll-margin-top:76px}
.dsec h2{font-family:var(--font-display);font-size:23px;font-weight:700;letter-spacing:-0.02em;margin-bottom:14px;display:flex;align-items:center;gap:10px;scroll-margin-top:76px}
.dsec h2 .hanchor{color:var(--ink-3);font-size:19px;opacity:0;transition:opacity 120ms;font-family:var(--font-mono);font-weight:400}
.dsec h2:hover .hanchor{opacity:1}
.dsec h3{font-family:var(--font-display);font-size:16.5px;font-weight:700;margin:26px 0 8px}
.dsec p{font-size:15px;color:var(--ink-2);line-height:1.7;margin-bottom:14px;overflow-wrap:break-word}
.dsec p strong,.dsec li strong{color:var(--ink)}
.dsec ul,.dsec ol{margin:0 0 16px 22px;display:flex;flex-direction:column;gap:6px}
.dsec li{font-size:15px;color:var(--ink-2);line-height:1.65;overflow-wrap:break-word}
.dsec li::marker{color:var(--accent)}
.dsec code{font-family:var(--font-mono);font-size:12.5px;color:var(--accent-2);background:rgba(76,158,255,0.09);border:1px solid rgba(76,158,255,0.16);border-radius:5px;padding:1px 6px}
.dsec a{color:var(--accent);font-weight:500}
.dsec a:hover{text-decoration:underline}
.dsec .dlink-mono{font-family:var(--font-mono);font-size:12.5px}
.dsec table{width:100%;max-width:100%;display:block;overflow-x:auto;overflow-y:hidden;border-collapse:collapse;margin:16px 0 22px;font-size:13.5px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px}
.dsec th{text-align:left;font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);padding:10px 14px;border-bottom:1px solid var(--line)}
.dsec td{padding:10px 14px;border-bottom:1px solid var(--line-2);color:var(--ink-2);vertical-align:top}
.dsec tr:last-child td{border-bottom:none}
.dsec td code{font-size:11.5px}

/* callouts */
.dcall{display:flex;gap:12px;padding:14px 16px;border-radius:10px;border:1px solid;margin:18px 0;font-size:14px;line-height:1.65}
.dcall .dc-ic{flex-shrink:0;width:20px;height:20px;display:grid;place-items:center;margin-top:1px;border:1px solid currentColor;border-radius:50%;font-family:var(--font-mono);font-weight:700;font-size:11px}
.dcall p{margin:0;color:var(--ink-2)}
.dcall strong{color:var(--ink)}
.dcall-info{background:rgba(76,158,255,0.06);border-color:rgba(76,158,255,0.3)}
.dcall-info .dc-ic{color:var(--accent)}
.dcall-warn{background:rgba(255,212,121,0.05);border-color:rgba(255,212,121,0.3)}
.dcall-warn .dc-ic{color:var(--amber)}
.dcall-danger{background:rgba(240,116,122,0.06);border-color:rgba(240,116,122,0.3)}
.dcall-danger .dc-ic{color:#f39a9e}

/* code blocks */
.dcode{margin:16px 0 22px;border-radius:11px;overflow:hidden;background:#060810;border:1px solid var(--line-2)}
.dcode-head{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface-2);border-bottom:1px solid var(--line-2)}
.dcode-lang{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3)}
.dcode-copy{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer;transition:color 120ms,border-color 120ms}
.dcode-copy:hover{color:var(--ink);border-color:var(--accent-deep)}
.dcode-copy.copied{color:var(--ok);border-color:rgba(87,201,138,0.4)}
.dcode pre{padding:14px 18px;overflow:auto;font-family:var(--font-mono);font-size:12.5px;line-height:1.7;color:var(--ink-2);white-space:pre}
.dcode pre .c-cm{color:var(--ink-3)}
.dcode pre .c-kw{color:#4c9eff}
.dcode pre .c-str{color:#8fd06f}
.dcode pre .c-fn{color:#79b6ff}
.dcode pre .c-dec{color:#ffd479}
.dcode pre .c-num{color:#c4a6ff}

/* right rail */
.dtoc{position:sticky;top:58px;height:calc(100vh - 58px);height:calc(100dvh - 58px);overflow-y:auto;padding:34px 20px 60px;display:none}
@media(min-width:1280px){.dtoc{display:block}}
.dtoc-label{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.dtoc a{display:block;font-size:12.5px;color:var(--ink-3);padding:4px 0 4px 12px;border-left:1px solid var(--line-2);transition:color 110ms,border-color 110ms}
.dtoc a:hover{color:var(--ink-2)}
.dtoc a.active{color:var(--accent-2);border-left-color:var(--accent)}
.dtoc .dtoc-edit{margin-top:22px;padding-top:16px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:10px}

/* pager */
.dpager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:64px;padding-top:28px;border-top:1px solid var(--line-2)}
@media(max-width:560px){.dpager{grid-template-columns:1fr}.dpager a.dp-next{text-align:left;align-items:flex-start}}
.dpager a{display:flex;flex-direction:column;gap:3px;background:var(--surface);border:1px solid var(--line-2);border-radius:11px;padding:14px 18px;transition:border-color 120ms,background 120ms}
.dpager a:hover{border-color:var(--accent-deep);background:var(--surface-2)}
.dpager .dp-dir{font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3)}
.dpager .dp-title{font-size:14px;font-weight:600;color:var(--ink)}
.dpager a.dp-next{text-align:right;align-items:flex-end}
.dpager a.dp-next .dp-title{color:var(--accent-2)}

/* mobile sidebar */
.ds-overlay{position:fixed;inset:0;background:rgba(4,6,10,0.6);z-index:80;display:none;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
body.nav-open .ds-overlay{display:block}
@media(max-width:900px){
  .dside{position:fixed;top:58px;left:0;bottom:0;width:280px;z-index:90;background:var(--bg);transform:translateX(-105%);transition:transform 200ms ease;border-right:1px solid var(--line);box-shadow:24px 0 60px -20px rgba(0,0,0,0.8)}
  body.nav-open .dside{transform:none}
  .dl{grid-template-columns:minmax(0,1fr)}
}
@media(min-width:901px){.ds-overlay{display:none!important}}

/* welcome page cards */
.dhome-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:26px 0 10px}
@media(max-width:640px){.dhome-cards{grid-template-columns:1fr}}
.dhome-card{background:var(--surface);border:1px solid var(--line-2);border-radius:11px;padding:18px;transition:border-color 120ms,background 120ms}
.dhome-card:hover{border-color:var(--accent-deep);background:var(--surface-2)}
.dhome-card h4{font-size:14.5px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.dhome-card h4 .dh-ic{color:var(--accent)}
.dhome-card p{font-size:13px;color:var(--ink-2);line-height:1.55;margin:0}

@media(prefers-reduced-motion:reduce){*{animation-duration:0.01ms!important;transition-duration:0.01ms!important}html{scroll-behavior:auto}}

/* print — content only */
@media print{
  .dt-bar,.dside,.dtoc,.ds-overlay,.dpager,.dcrumb,.dcode-copy{display:none!important}
  body{background:#fff;color:#111}
  .dl{display:block;max-width:none}
  .dcontent{max-width:none;padding:0}
  .dpage-title,.dsec h2,.dsec h3{color:#111}
  .dsec p,.dsec li,.dsec td{color:#222}
  .dsec code{color:#0b4fa0;background:#f0f4fa;border-color:#d5e2f5}
  .dcode{background:#f7f9fc;border-color:#dde5ef}
  .dcode pre{color:#222;white-space:pre-wrap}
  .dcode pre .c-kw{color:#0b4fa0}.dcode pre .c-str{color:#1a7a44}.dcode pre .c-fn{color:#0b5bb5}.dcode pre .c-dec{color:#9a6700}.dcode pre .c-cm{color:#666}
  .dcall{border-color:#dde5ef}
  .dcall p{color:#222}
  .dsec a{color:#0b4fa0}
  .dsec table{border-color:#dde5ef;display:table}
  .dsec th{background:#f0f4fa}
  .dsec tr,.dsec td,.dsec th{break-inside:avoid}
  .dsec{break-inside:avoid-page}
  .hanchor{display:none}
}

/* Markdown content and keyboard-accessible documentation controls. */
.dcontent{min-width:0;overflow-wrap:anywhere}
.dsec img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:10px;margin:20px 0}
.dsec pre code{color:inherit;background:none;border:0;padding:0;font-size:inherit;white-space:pre;overflow-wrap:normal}
.dsec blockquote{border-left:1px solid var(--accent);padding:12px 18px;margin:18px 0;background:var(--surface)}
.dsec h3,.dsec h4{scroll-margin-top:85px;margin-top:28px;margin-bottom:10px}
.dsec hr{border:0;border-top:1px solid var(--line);margin:32px 0}
.dsec ul,.dsec ol{padding-left:24px}
.dsec li>p{margin-bottom:4px}
.dcode-copy{min-height:32px}
.skip-link{color:#06101e}
.dr-item{width:100%;text-align:left;font:inherit;background:transparent;border:0;border-bottom:1px solid var(--line-2)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.tour-control{font:inherit;font-size:13px;color:var(--accent-2);padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer;margin-bottom:12px}
.dsec .tour-still{display:none}
.tour-paused .tour-still{display:block}
.tour-paused .tour-animation{display:none}
@media(max-width:900px){.js body:not(.nav-open) .dside{visibility:hidden}body.nav-open .dside{visibility:visible}.ds-overlay{top:58px}.dt-search{min-width:0}.dt-search input{min-width:0}.dt-bar{gap:10px}.dt-actions{gap:0}}
@media(max-width:560px){.dt-actions{display:none}}
@media(pointer:coarse){.ds-link{min-height:44px}.dt-burger{width:44px;height:44px}.dcode-copy{min-height:44px}}
html:not(.js) .dt-search,html:not(.js) .dt-burger,html:not(.js) .tour-control{display:none}
html:not(.js) .dside{position:static;transform:none;height:auto;width:auto;box-shadow:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
