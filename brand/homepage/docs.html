a{color:inherit;text-decoration:none}
button{font-family:inherit}
.skip-link{position:absolute;left:12px;top:-60px;z-index:100;background:var(--accent);color:#fff;font-weight:700;font-size:13px;padding:10px 16px;border-radius:8px;transition:top 140ms ease}
.skip-link:focus{top:12px;outline:2px solid #fff;outline-offset:2px}

/* top bar */
.dt-bar{position:sticky;top:0;z-index:60;height:58px;background:rgba(9,11,16,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:14px;padding:0 18px}
.dt-brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand-mark{width:26px;height:26px;border-radius:6px;box-shadow:0 4px 14px -6px rgba(20,86,208,0.65);display:block}
.dt-brand-name{font-family:var(--font-display);font-size:18px;font-weight:800;letter-spacing:-0.04em;color:var(--ink)}
.dt-badge{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-glow);border:1px solid rgba(76,158,255,0.28);border-radius:5px;padding:2px 8px;flex-shrink:0}
.dt-search{position:relative;margin-left:auto;margin-right:6px;width:min(340px,38vw);flex-shrink:1}
.dt-search input{width:100%;font-family:var(--font-sans);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 12px 8px 34px;outline:none;transition:border-color 120ms ease,box-shadow 120ms ease}
.dt-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.dt-search input::placeholder{color:var(--ink-3)}
.dt-search .ds-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;display:flex}
.dt-search .kbd-hint{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-size:10px;color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px;pointer-events:none}
.dt-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.dt-btn{font-size:12.5px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;transition:background 120ms,border-color 120ms,color 120ms;white-space:nowrap}
.dt-btn:hover{background:var(--surface-3);color:var(--ink);border-color:var(--accent-deep)}
.dt-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dt-btn-primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff;border-color:var(--accent-deep)}
.dt-btn-primary:hover{background:linear-gradient(180deg,#93c4ff,var(--accent-2));color:#fff}
.dt-burger{display:none;width:36px;height:36px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;flex-shrink:0}
.dt-burger span{display:block;width:15px;height:2px;border-radius:2px;background:var(--ink-2)}
@media(max-width:900px){.dt-burger{display:flex}.dt-search{width:min(320px,46vw)}.kbd-hint{display:none}}
@media(max-width:560px){.dt-badge{display:none}.dt-actions .gh{display:none}.dt-search{width:auto;flex:1}}
@media(max-width:360px){.dt-actions .dt-btn{display:none}.dt-bar{padding:0 12px}}

/* results dropdown */
.dresults{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:0 24px 60px -20px rgba(0,0,0,0.85);overflow:hidden;display:none;z-index:70}
.dresults.open{display:block}
.dr-item{display:flex;flex-direction:column;gap:1px;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line-2)}
.dr-item:last-child{border-bottom:none}
.dr-item:hover,.dr-item.sel{background:var(--surface-2)}
.dr-title{font-size:13px;font-weight:600;color:var(--ink)}
.dr-title mark{background:transparent;color:var(--accent-2);font-weight:700}
.dr-sub{font-size:11px;color:var(--ink-3);font-family:var(--font-mono)}
.dr-group{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 14px 3px}
.dr-empty{padding:14px;font-size:13px;color:var(--ink-3)}

/* layout */
.dl{display:grid;grid-template-columns:264px minmax(0,1fr);max-width:1440px;margin:0 auto}
@media(min-width:1280px){.dl{grid-template-columns:264px minmax(0,1fr) 210px}}

/* sidebar */
.dside{position:sticky;top:58px;height:calc(100vh - 58px);height:calc(100dvh - 58px);overflow-y:auto;border-right:1px solid var(--line-2);padding:22px 12px 60px;background:rgba(9,11,16,0.5)}
.ds-group{margin-bottom:22px}
.ds-group-label{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-3);padding:0 10px 7px;display:flex;align-items:center;gap:8px}
.ds-group-label::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0.55}
.ds-link{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;color:var(--ink-2);padding:6px 10px;border-radius:7px;transition:background 110ms,color 110ms}
.ds-link:hover{background:var(--surface-2);color:var(--ink)}
.ds-link:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ds-link.active{background:var(--accent-glow);color:var(--accent-2);font-weight:600}
.ds-link .ds-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);opacity:0.55;flex-shrink:0}
.ds-link.active .ds-dot{background:var(--accent);opacity:1;box-shadow:0 0 8px rgba(76,158,255,0.7)}
.ds-foot{margin-top:26px;padding:12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-size:11.5px;color:var(--ink-3);line-height:1.6}
.ds-foot a{color:var(--accent);font-weight:600}
.ds-foot a:hover{text-decoration:underline}

/* content */
.dcontent{padding:44px 52px 90px;min-width:0;max-width:860px}
@media(max-width:900px){.dcontent{padding:32px 26px 80px}}
.dcrumb{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.dcrumb a:hover{color:var(--accent)}
.dcrumb .sep{opacity:0.5}
.dcrumb .here{color:var(--ink-2)}
.dpage-title{font-family:var(--font-display);font-size:clamp(30px,4vw,42px);font-weight:800;letter-spacing:-0.03em;line-height:1.05;margin-bottom:10px;text-wrap:balance}
.dpage-desc{font-size:16px;color:var(--ink-2);max-width:60ch;line-height:1.65;margin-bottom:30px}
.dsec{margin-top:44px;scroll-margin-top:76px}
.dsec h2{font-family:var(--font-display);font-size:23px;font-weight:700;letter-spacing:-0.02em;margin-bottom:14px;display:flex;align-items:center;gap:10px;scroll-margin-top:76px}
.dsec h2 .hanchor{color:var(--ink-3);font-size:19px;opacity:0;transition:opacity 120ms;font-family:var(--font-mono);font-weight:400}
.dsec h2:hover .hanchor{opacity:1}
.dsec h3{font-family:var(--font-display);font-size:16.5px;font-weight:700;margin:26px 0 8px}
.dsec p{font-size:15px;color:var(--ink-2);line-height:1.7;margin-bottom:14px;overflow-wrap:break-word}
.dsec p strong,.dsec li strong{color:var(--ink)}
.dsec ul,.dsec ol{margin:0 0 16px 22px;display:flex;flex-direction:column;gap:6px}
.dsec li{font-size:15px;color:var(--ink-2);line-height:1.65;overflow-wrap:break-word}
.dsec li::marker{color:var(--accent)}
.dsec code{font-family:var(--font-mono);font-size:12.5px;color:var(--accent-2);background:rgba(76,158,255,0.09);border:1px solid rgba(76,158,255,0.16);border-radius:5px;padding:1px 6px}
.dsec a{color:var(--accent);font-weight:500}
.dsec a:hover{text-decoration:underline}
.dsec .dlink-mono{font-family:var(--font-mono);font-size:12.5px}
.dsec table{width:100%;max-width:100%;display:block;overflow-x:auto;overflow-y:hidden;border-collapse:collapse;margin:16px 0 22px;font-size:13.5px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px}
.dsec th{text-align:left;font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);padding:10px 14px;border-bottom:1px solid var(--line)}
.dsec td{padding:10px 14px;border-bottom:1px solid var(--line-2);color:var(--ink-2);vertical-align:top}
.dsec tr:last-child td{border-bottom:none}
.dsec td code{font-size:11.5px}

/* callouts */
.dcall{display:flex;gap:12px;padding:14px 16px;border-radius:10px;border:1px solid;margin:18px 0;font-size:14px;line-height:1.65}
.dcall .dc-ic{flex-shrink:0;width:20px;height:20px;display:grid;place-items:center;margin-top:1px;border:1px solid currentColor;border-radius:50%;font-family:var(--font-mono);font-weight:700;font-size:11px}
.dcall p{margin:0;color:var(--ink-2)}
.dcall strong{color:var(--ink)}
.dcall-info{background:rgba(76,158,255,0.06);border-color:rgba(76,158,255,0.3)}
.dcall-info .dc-ic{color:var(--accent)}
.dcall-warn{background:rgba(255,212,121,0.05);border-color:rgba(255,212,121,0.3)}
.dcall-warn .dc-ic{color:var(--amber)}
.dcall-danger{background:rgba(240,116,122,0.06);border-color:rgba(240,116,122,0.3)}
.dcall-danger .dc-ic{color:#f39a9e}

/* code blocks */
.dcode{margin:16px 0 22px;border-radius:11px;overflow:hidden;background:#060810;border:1px solid var(--line-2)}
.dcode-head{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface-2);border-bottom:1px solid var(--line-2)}
.dcode-lang{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3)}
.dcode-copy{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer;transition:color 120ms,border-color 120ms}
.dcode-copy:hover{color:var(--ink);border-color:var(--accent-deep)}
.dcode-copy.copied{color:var(--ok);border-color:rgba(87,201,138,0.4)}
.dcode pre{padding:14px 18px;overflow:auto;font-family:var(--font-mono);font-size:12.5px;line-height:1.7;color:var(--ink-2);white-space:pre}
.dcode pre .c-cm{color:var(--ink-3)}
.dcode pre .c-kw{color:#4c9eff}
.dcode pre .c-str{color:#8fd06f}
.dcode pre .c-fn{color:#79b6ff}
.dcode pre .c-dec{color:#ffd479}
.dcode pre .c-num{color:#c4a6ff}

/* right rail */
.dtoc{position:sticky;top:58px;height:calc(100vh - 58px);height:calc(100dvh - 58px);overflow-y:auto;padding:34px 20px 60px;display:none}
@media(min-width:1280px){.dtoc{display:block}}
.dtoc-label{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.dtoc a{display:block;font-size:12.5px;color:var(--ink-3);padding:4px 0 4px 12px;border-left:1px solid var(--line-2);transition:color 110ms,border-color 110ms}
.dtoc a:hover{color:var(--ink-2)}
.dtoc a.active{color:var(--accent-2);border-left-color:var(--accent)}
.dtoc .dtoc-edit{margin-top:22px;padding-top:16px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:10px}

/* pager */
.dpager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:64px;padding-top:28px;border-top:1px solid var(--line-2)}
@media(max-width:560px){.dpager{grid-template-columns:1fr}.dpager a.dp-next{text-align:left;align-items:flex-start}}
.dpager a{display:flex;flex-direction:column;gap:3px;background:var(--surface);border:1px solid var(--line-2);border-radius:11px;padding:14px 18px;transition:border-color 120ms,background 120ms}
.dpager a:hover{border-color:var(--accent-deep);background:var(--surface-2)}
.dpager .dp-dir{font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3)}
.dpager .dp-title{font-size:14px;font-weight:600;color:var(--ink)}
.dpager a.dp-next{text-align:right;align-items:flex-end}
.dpager a.dp-next .dp-title{color:var(--accent-2)}

/* mobile sidebar */
.ds-overlay{position:fixed;inset:0;background:rgba(4,6,10,0.6);z-index:80;display:none;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
body.nav-open .ds-overlay{display:block}
@media(max-width:900px){
  .dside{position:fixed;top:58px;left:0;bottom:0;width:280px;z-index:90;background:var(--bg);transform:translateX(-105%);transition:transform 200ms ease;border-right:1px solid var(--line);box-shadow:24px 0 60px -20px rgba(0,0,0,0.8)}
  body.nav-open .dside{transform:none}
  .dl{grid-template-columns:minmax(0,1fr)}
}
@media(min-width:901px){.ds-overlay{display:none!important}}

/* welcome page cards */
.dhome-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:26px 0 10px}
@media(max-width:640px){.dhome-cards{grid-template-columns:1fr}}
.dhome-card{background:var(--surface);border:1px solid var(--line-2);border-radius:11px;padding:18px;transition:border-color 120ms,background 120ms}
.dhome-card:hover{border-color:var(--accent-deep);background:var(--surface-2)}
.dhome-card h4{font-size:14.5px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.dhome-card h4 .dh-ic{color:var(--accent)}
.dhome-card p{font-size:13px;color:var(--ink-2);line-height:1.55;margin:0}

@media(prefers-reduced-motion:reduce){*{animation-duration:0.01ms!important;transition-duration:0.01ms!important}html{scroll-behavior:auto}}

/* print — content only */
@media print{
  .dt-bar,.dside,.dtoc,.ds-overlay,.dpager,.dcrumb,.dcode-copy{display:none!important}
  body{background:#fff;color:#111}
  .dl{display:block;max-width:none}
  .dcontent{max-width:none;padding:0}
  .dpage-title,.dsec h2,.dsec h3{color:#111}
  .dsec p,.dsec li,.dsec td{color:#222}
  .dsec code{color:#0b4fa0;background:#f0f4fa;border-color:#d5e2f5}
  .dcode{background:#f7f9fc;border-color:#dde5ef}
  .dcode pre{color:#222;white-space:pre-wrap}
  .dcode pre .c-kw{color:#0b4fa0}.dcode pre .c-str{color:#1a7a44}.dcode pre .c-fn{color:#0b5bb5}.dcode pre .c-dec{color:#9a6700}.dcode pre .c-cm{color:#666}
  .dcall{border-color:#dde5ef}
  .dcall p{color:#222}
  .dsec a{color:#0b4fa0}
  .dsec table{border-color:#dde5ef;display:table}
  .dsec th{background:#f0f4fa}
  .dsec tr,.dsec td,.dsec th{break-inside:avoid}
  .dsec{break-inside:avoid-page}
  .hanchor{display:none}
}
</style>
</head>

{
  id: 'welcome', g: 'Start here', title: 'Welcome to Nodyra', gh: 'README.md',
  desc: 'Nodyra is a self-hostable, Python-native workflow automation platform. Every node is real Python — compose on a canvas, inspect everything, and ship versioned workflows that run on your infrastructure.',
  s: [
    { id: 'what', h: 'What you get', html: `
      <ul>
        <li><strong>A canvas that is real code.</strong> Each node is a plain Python function. Click any node to inspect its source, inputs, outputs, logs, and timing — no magic layer.</li>
        <li><strong>AI-built workflows you can read.</strong> Connect any MCP-capable agent (Claude Code, Cursor, Claude Desktop) and watch it build, run, and publish workflows you can edit afterwards.</li>
        <li><strong>Your compute, your data.</strong> Self-host with Docker Compose or Helm. Credentials stay in an encrypted vault; runs execute in per-environment Python subprocesses or hardened sandboxes.</li>
        <li><strong>Production by default.</strong> Versioned publishing, cron/webhook deployments, durable queue with dead-letter replay, RBAC, audit log, and fair-code licensing.</li>
      </ul>` },
    { id: 'quick', h: 'Quick start', html: `
      <p>Five minutes to first run, once container images are available:</p>
      ${dcode('bash', `cp deploy/.env.example deploy/.env
openssl rand -hex 32
docker compose -f deploy/docker-compose.yml up --build -d
curl http://localhost:8000/health/ready`)}
      <p>Open <a href="http://localhost:5173" rel="noopener" class="dlink-mono">http://localhost:5173</a>. The first registered account becomes the owner; registration then closes unless you re-enable it. The full walkthrough is in <a href="#/getting-started">Getting started</a>.</p>` },

{
  id: 'getting-started', g: 'Guides', title: 'Getting started', gh: 'docs/getting-started.md',
  desc: 'From zero to a running workflow in about five minutes. This guide targets first value once container images are available; a first local build can take longer depending on network and CPU.',
  s: [
    { id: 'requirements', h: '1. Requirements', html: `
      <ul>
        <li><strong>Docker route (recommended):</strong> Docker Engine or Docker Desktop with Compose.</li>
        <li><strong>Local dev route:</strong> Python 3.12, <a href="https://docs.astral.sh/uv/" rel="noopener">uv</a>, Node.js 20+, and Docker for Postgres/Redis/MinIO.</li>
      </ul>` },
    { id: 'docker', h: '2. Start with Docker Compose', html: `
      <p>Copy the example environment file:</p>
      ${dcode('bash', `cp deploy/.env.example deploy/.env`)}
      <p>Replace all three <code>CHANGE-ME</code> values. Run <code>openssl rand -hex 32</code> three times and paste one generated value into each setting. Shell expressions such as <code>$(openssl ...)</code> are not expanded inside an environment file.</p>
      ${dcall('warn', `<strong>Do not hand-write <code>deploy/.env</code> from scratch</strong> — Compose also hard-requires <code>MINIO_ROOT_PASSWORD</code> and fails before starting anything if it is missing. Copying the example is the supported path.`)}
      ${dcode('bash', `docker compose -f deploy/docker-compose.yml up --build -d
curl http://localhost:8000/health/live
curl http://localhost:8000/health/ready`)}
      <p>The stack includes PostgreSQL, Redis, MinIO, the FastAPI control plane, a dispatch worker, and the web app on <a href="http://localhost:5173" rel="noopener" class="dlink-mono">http://localhost:5173</a>.</p>
      ${dcall('info', `Startup is <strong>fail-closed</strong>: if you keep a default <code>SECRET_KEY</code> with auth enabled, or omit <code>INTERNAL_API_TOKEN</code> in a split topology, the server refuses to boot rather than run insecurely.`)}` },
    { id: 'owner', h: '3. Create the owner account', html: `
      <p>The first registered account becomes the <code>owner</code>. Registration closes automatically after the first user unless you explicitly enable it with <code>AUTH_ALLOW_REGISTRATION=true</code>.</p>` },
    { id: 'template', h: '4. Run a verified starter template', html: `
      <ol>
        <li>Open <strong>Workflows</strong> and choose <strong>Create from template</strong>.</li>
        <li>Select <strong>Dataset filter and CSV export</strong> — it needs no external credential.</li>
        <li>Create the workflow, press <strong>Run</strong>, and open the execution when it finishes.</li>
        <li>Inspect node input/output, then open <strong>Artifacts</strong> to see the CSV and its run/workflow lineage.</li>
      </ol>` },
    { id: 'scratch', h: '5. Build a workflow from scratch', html: `
      <ol>
        <li>Click <strong>New workflow</strong> and drag a <strong>Manual Trigger</strong> onto the canvas.</li>
        <li>Add an <strong>HTTP Request</strong> node, point it at an API you like, and wire it to the trigger.</li>
        <li>Add a <strong>Code</strong> node and transform the response with plain Python — the input arrives as the first function argument.</li>
        <li>Press <strong>Run</strong>. Click any node to inspect its exact input, output, logs, and timing.</li>
      </ol>
      <p>Every node is a plain Python function. To write your own:</p>
      ${dcode('python', `<span class="c-kw">from</span> nodyra.sdk <span class="c-kw">import</span> node

<span class="c-dec">@node</span>(name=<span class="c-str">"Normalize Customer"</span>, id=<span class="c-str">"normalize_customer"</span>, category=<span class="c-str">"Data"</span>)
<span class="c-kw">def</span> <span class="c-fn">normalize_customer</span>(input: dict, lowercase_email: bool = True) -&gt; dict:
    customer = dict(input)
    <span class="c-kw">if</span> lowercase_email <span class="c-kw">and</span> customer.get(<span class="c-str">"email"</span>):
        customer[<span class="c-str">"email"</span>] = customer[<span class="c-str">"email"</span>].lower()
    <span class="c-kw">return</span> customer`)}
      <p>Upload the module and it appears in the palette. See <a href="#/nodes">Writing nodes</a>.</p>` },
    { id: 'demo', h: '6. Seed the demo workspace', html: `
      ${dcode('bash', `make demo`)}
      <p>Creates a populated local instance with demo workflows, a fake credential, a runnable webhook, and one green MCP-created run. The demo disables authentication, so every published port is bound to <code>127.0.0.1</code>. Use the authenticated deployment path for access from another machine.</p>
      ${dcode('bash', `curl -X POST http://localhost:8000/webhook/demo/intake \\
  -H "Content-Type: application/json" \\
  -d '{"customer":"Ada","event":"trial_started"}'`)}
      <p>Stop the demo without deleting its data: <code>make demo-down</code>.</p>` },
    { id: 'agent', h: '7. Let an AI agent build it', html: `
      <p>Nodyra ships a first-class MCP server with 61 tools. Connect Claude Code:</p>
      ${dcode('bash', `claude mcp add --transport http nodyra https://your-instance/mcp \\
  --header "Authorization: Bearer &lt;api-token&gt;"`)}
      <p>Then describe the workflow you want; it appears on the canvas — editable, testable, deployable. Full guide: <a href="#/mcp-quickstart">MCP quickstart</a>.</p>` },
    { id: 'production', h: '8. Go to production', html: `
      <ul>
        <li><strong>Publish</strong> your workflow to create an immutable version, then create a <strong>deployment</strong> pinned to that version. Drafts never affect production.</li>
        <li>Add <strong>schedule</strong> or <strong>webhook</strong> triggers to the deployment.</li>
        <li>Pick an execution posture: trusted single-tenant (default), sandboxed (<code>EXECUTION_SANDBOX=auto|required</code> — recommended when workflows run AI-generated code), or multi-tenant.</li>
        <li>Read the <a href="#/deployment">deployment guide</a> for Helm, scaling workers, and the production checklist — and set up backups before you rely on it.</li>
      </ul>` }
  ]
},
{
  id: 'mcp-quickstart', g: 'Guides', title: 'MCP quickstart', gh: 'docs/mcp-quickstart.md',
  desc: 'Point an MCP-capable agent at your instance and it can build, test, and deploy workflows you watch live on the canvas. 61 tools cover graph editing, validation, publishing, runs, schedules, environments, and approvals.',
  s: [
    { id: 'token', h: '1. Create an API token', html: `
      <p><strong>Settings → API tokens → New token.</strong> Scopes: <code>workflow:read</code>, <code>workflow:write</code>, <code>workflow:run</code> — add <code>workflow:publish</code> and <code>deployment:write</code> if the agent should publish or manage deployments. Copy the <code>ndpat_...</code> value.</p>` },
    { id: 'connect', h: '2. Connect your agent', html: `
      <p><strong>Claude Code:</strong></p>
      ${dcode('bash', `claude mcp add --transport http nodyra http://localhost:8000/mcp \\
  --header "Authorization: Bearer ndpat_YOUR_TOKEN"`)}
      <p>Use the same <code>/mcp</code> path on the bundled web origin, for example <code>https://nodyra.example.com/mcp</code>; the shipped Vite, nginx, and Helm ingress configurations proxy that path to the API.</p>
      <p><strong>Claude Desktop / Cursor / any streamable-HTTP client:</strong> add to the MCP config:</p>
      ${dcode('json', `{
  "mcpServers": {
    "nodyra": {
      "type": "http",
      "url": "http://localhost:8000/mcp",
      "headers": { "Authorization": "Bearer ndpat_YOUR_TOKEN" }
    }
  }
}`)}` },
    { id: 'try', h: '3. Try it', html: `
      <p>Ask the agent: <em>“List my Nodyra workflows”</em>, then <em>“Create a workflow that fetches https://api.github.com/repos/astral-sh/uv, extracts the star count with a Code node, and runs it”</em>.</p>
      <p>Useful tool names: <code>list_workflows</code>, <code>create_workflow</code>, <code>add_node</code>, <code>add_edge</code>, <code>validate_workflow_graph</code>, <code>run_workflow</code>, <code>get_run</code>.</p>` },
    { id: 'safety', h: '4. Safety model', html: `
      <ul>
        <li>Tokens are org-scoped; tools honour the token's scopes.</li>
        <li>All tool calls hit the audit log like any API call.</li>
        <li><code>/mcp</code> is rate-limited at 120 requests per minute per principal.</li>
        <li>Destructive tools (<code>delete_workflow</code>, rollbacks) require an explicit <code>approve: true</code> argument.</li>
        <li>Graph edits accept <code>expected_graph_revision</code> for optimistic concurrency, so agents editing alongside humans get a conflict error instead of clobbering.</li>
        <li>If <code>auth_required=false</code>, read-only MCP tools are anonymous by design. Put <code>/mcp</code> behind an authenticating proxy before exposing it publicly.</li>
      </ul>` },
    { id: 'expose', h: 'Expose a workflow as an MCP tool', html: `
      <p>Any published workflow can itself become an MCP tool for agents: <code>enable_mcp_tool</code> with a JSON-schema for its parameters. External MCP servers can likewise become nodes inside workflows: <strong>Settings → MCP Connections</strong>.</p>` }
  ]
},
{
  id: 'recipes', g: 'Guides', title: 'Recipes', gh: 'docs/recipes.md',
  desc: 'Copy-paste patterns for the work that comes up every week. Start from the template gallery when a matching verified template exists.',
  s: [
    { id: 'poll', h: 'Poll an API and normalize records', html: `
      <p>Create <strong>Schedule Trigger → HTTP Request → Code</strong>. Configure the request for a public HTTPS endpoint, then use:</p>
      ${dcode('python', `rows = input if isinstance(input, list) else input.get("items", [])
output = [
    {"id": row.get("id"), "name": str(row.get("name", "")).strip()}
    for row in rows
    if row.get("id") is not None
]`)}
      <p>Pin a representative HTTP response while authoring, add a timeout/retry policy, and publish only after the output schema is stable.</p>` },
    { id: 'dataset', h: 'Filter a large dataset without loading it into memory', html: `
      <p>Create <strong>Manual Trigger → Records To Dataset → Dataset Filter → CSV Write</strong>. Use the filter expression <code>region = 'west' AND amount &gt;= 100</code>.</p>
      <p>Dataset nodes pass artifact-backed <code>DatasetRef</code> handles, so the workflow does not serialize a large DataFrame through every edge.</p>` },
    { id: 'webhook-alert', h: 'Turn a webhook into an operational alert', html: `
      <p>Create <strong>Webhook Trigger → Code → Slack</strong>. Keep inbound authentication enabled, map only approved fields, and store the Slack token as a scoped credential. Deploy a failure workflow for provider errors and alert on sustained failure ratio rather than a single retry.</p>` },
    { id: 'ci', h: 'Invoke from CI', html: `
      ${dcode('bash', `python -m pip install ./packages/client
nodyra --base-url "$NODYRA_BASE_URL" --token "$NODYRA_TOKEN" workflow run daily-report --wait`)}
      <p>The CLI and typed Python client drive the same API as the editor — list, create, run, publish, and export workflows from any pipeline. See <a href="https://github.com/Harshit-repo/noodle/tree/main/packages/client" rel="noopener">packages/client</a>.</p>` },
    { id: 'agent-recipe', h: 'Let the agent draft it, then tighten it', html: `
      <p>A fast path for new automations: ask an MCP-connected agent to build the first version of the graph, then review node-by-node in the editor — fix expressions, pin versions, add retries — and publish. The graph stays a normal, editable Nodyra workflow the whole time.</p>` }
  ]
},
{
  id: 'nodes', g: 'Develop', title: 'Writing nodes', gh: 'docs/nodes.md',
  desc: 'There are two ways to ship a node: built-in nodes (a decorated function in packages/nodes) or code modules (a .py file uploaded through the editor). Both produce the same manifest the editor consumes.',
  s: [
    { id: 'example', h: 'Built-in node example', html: `
      ${dcode('python', `<span class="c-kw">from</span> typing <span class="c-kw">import</span> Any

<span class="c-kw">from</span> nodyra.sdk <span class="c-kw">import</span> node

<span class="c-dec">@node</span>(
    name=<span class="c-str">"HTTP Request"</span>,
    id=<span class="c-str">"http_request"</span>,
    category=<span class="c-str">"Transform"</span>,
    icon=<span class="c-str">"globe"</span>,
    params={
        <span class="c-str">"url"</span>: {<span class="c-str">"placeholder"</span>: <span class="c-str">"https://api.example.com/data"</span>},
        <span class="c-str">"method"</span>: {<span class="c-str">"choices"</span>: [<span class="c-str">"GET"</span>, <span class="c-str">"POST"</span>, <span class="c-str">"PUT"</span>, <span class="c-str">"PATCH"</span>, <span class="c-str">"DELETE"</span>]},
    },
)
<span class="c-kw">def</span> <span class="c-fn">http_request</span>(input: Any = None, url: str = "", method: str = "GET") -&gt; Any:
    <span class="c-str">"""Call an HTTP API and return the JSON body."""</span>
    <span class="c-kw">import</span> requests
    response = requests.request(method, url, timeout=30)
    <span class="c-kw">try</span>:
        <span class="c-kw">return</span> response.json()
    <span class="c-kw">except</span> ValueError:
        <span class="c-kw">return</span> response.text`)}` },
    { id: 'sdk', h: 'How the SDK reads your function', html: `
      <ul>
        <li>Parameters whose names appear in <code>@node(inputs=[...])</code> (default <code>["input"]</code>) are <strong>input ports</strong> — they receive data from upstream nodes via edges. Triggers pass <code>inputs=[]</code>.</li>
        <li>All other function parameters are <strong>config parameters</strong> — edited in the inspector, never wired. Type annotations drive the form field; the <code>params=</code> decorator argument attaches UI metadata.</li>
        <li>The return value becomes the node output. To declare multiple named outputs for branching, pass <code>@node(outputs=["true", "false"])</code> and return a dict; omitting a key marks that branch as untaken.</li>
      </ul>` },
    { id: 'categories', h: 'Categories and icons', html: `
      <p>Set <code>category</code> to one of <code>Triggers</code>, <code>API</code>, <code>Logic</code>, <code>AI</code>, <code>Data</code>, <code>Transform</code>, <code>Integrations</code>, <code>Utility</code>. The editor colours nodes by category. <code>icon</code> is a name from the built-in icon set (<code>play</code>, <code>clock</code>, <code>webhook</code>, <code>branch</code>, <code>code</code>, <code>globe</code>, <code>database</code>, <code>storage</code>, <code>ai</code>, and more).</p>
      <p>Every visible built-in node must declare a specific category and a concise description; a test in the manifest suite enforces this so the palette, AI builder, and generated tool descriptions stay useful as the catalog grows.</p>
      <p><code>async def</code> nodes are awaited by the engine — use them for IO-bound work.</p>` },
    { id: 'controls', h: 'Per-node controls', html: `
      <p>The Settings tab in the inspector exposes:</p>
      <table>
        <tr><th>Setting</th><th>Behaviour</th></tr>
        <tr><td><code>disabled</code></td><td>Skip the node and downstream consumers.</td></tr>
        <tr><td><code>on_error</code></td><td><code>stop</code> (default), <code>continue</code>, or <code>continue_branch</code>.</td></tr>
        <tr><td><code>retry_on_fail</code> + <code>retries</code></td><td>Retries with exponential backoff and small jitter.</td></tr>
        <tr><td><code>timeout_seconds</code></td><td>Wraps the call in <code>asyncio.wait_for</code>; sync nodes hop to a worker thread only when a timeout is set.</td></tr>
        <tr><td><code>always_output_data</code></td><td>Emit empty output instead of skipping consumers when the node has no result.</td></tr>
      </table>` },
    { id: 'modules', h: 'Code modules (upload-to-nodes)', html: `
      <p>Open the <strong>Code Library</strong> page and upload a <code>.py</code> file. Discovery is <strong>AST-only</strong> — uploaded code is never executed in the API process. Each top-level <code>def</code> becomes a node:</p>
      ${dcode('python', `<span class="c-kw">def</span> <span class="c-fn">add</span>(x: int = 0, y: int = 0) -&gt; int:
    <span class="c-str">"""Return x + y."""</span>
    <span class="c-kw">return</span> x + y`)}
      <p>Every function parameter is rendered in the inspector. To wire upstream data into a parameter, write an expression: <code>{{ $json.x }}</code> reads <code>x</code> off the wired upstream, and <code>{{ $node["other_id"].main.field }}</code> reads from a non-wired node. The ƒx toggle flips between fixed and expression mode.</p>
      <p>After uploading a procedural file, click <strong>Build starter graph</strong> — the backend walks assignments, infers edges from variable flow, and pre-populates literal arguments as default params for you to review.</p>
      <p>Scopes: <strong>Global</strong> (every workflow), <strong>Environment</strong> (workflows on that env), <strong>Workflow</strong> (stored alongside the workflow).</p>` },
    { id: 'artifacts', h: 'Artifacts', html: `
      <p>For outputs too large for a node result — DataFrames, CSV/PDF exports, screenshots, scraped HTML, model outputs — write to artifact storage instead:</p>
      ${dcode('python', `<span class="c-kw">import</span> pandas <span class="c-kw">as</span> pd

df = pd.read_csv(input[<span class="c-str">"source"</span>])
output = artifacts.<span class="c-fn">write_dataframe</span>(df, name=<span class="c-str">"processed.csv"</span>)`)}
      <p>Helpers: <code>write_bytes</code>, <code>write_text</code>, <code>write_json</code>, <code>write_dataframe</code>, and matching <code>read_*</code> / <code>open</code>. Writers return a small JSON-friendly ref that flows through edges like any other value; the UI renders it as an artifact card with size/type metadata and a download link. Retention prune drops files for expired runs automatically.</p>` },
    { id: 'datasets', h: 'DatasetRef tables', html: `
      <p>DatasetRef is the preferred shape for tabular data too large to copy through every node as inline JSON — a small reference to a Parquet-backed table plus schema, row-count, and preview metadata.</p>
      ${dcode('text', `records / CSV / DataFrame
  -> Records To Dataset or CSV Parse
  -> Dataset Filter / Dataset Select Columns / DuckDB SQL / Dataset Limit
  -> Dataset Preview or CSV Write
  -> optional Dataset To Records for inline-only consumers`)}
      <p>Declare DatasetRef ports with <code>input_kinds</code> / <code>output_kinds</code>; the editor uses those port kinds to block confusing wires and offer quick fixes such as <strong>Records To Dataset</strong>.</p>` },
    { id: 'typed', h: 'Typed values across the wire', html: `
      <p>The engine serializes non-JSON Python types into typed envelopes only when values leave the Python process (WebSocket events, persisted outputs, pinned data, retry caches). In-process hand-off uses real Python objects. Handled types include DataFrame, datetime/date/time, Decimal, tuple, set/frozenset, and bytes.</p>` },
    { id: 'testing', h: 'Testing', html: `
      <p>The engine is async and importable. A complete graph round-trip:</p>
      ${dcode('python', `<span class="c-kw">from</span> nodyra.engine <span class="c-kw">import</span> execute
<span class="c-kw">from</span> nodyra.models <span class="c-kw">import</span> Edge, GraphNode, WorkflowGraph
<span class="c-kw">from</span> nodyra.sdk <span class="c-kw">import</span> registry
<span class="c-kw">import</span> nodyra_nodes

graph = WorkflowGraph(
    nodes=[
        GraphNode(id=<span class="c-str">"t"</span>, type=<span class="c-str">"manual_trigger"</span>, params={ <span class="c-str">"data"</span>: { <span class="c-str">"n"</span>: 3 } }),
        GraphNode(id=<span class="c-str">"c"</span>, type=<span class="c-str">"code"</span>, params={ <span class="c-str">"code"</span>: <span class="c-str">"output = input['n'] * 2"</span> }),
    ],
    edges=[Edge(source=<span class="c-str">"t"</span>, target=<span class="c-str">"c"</span>)],
)
result = <span class="c-kw">await</span> execute(graph, registry)
<span class="c-kw">assert</span> result.nodes[<span class="c-str">"c"</span>].outputs[<span class="c-str">"main"</span>] == 6`)}` },
    { id: 'integrations', h: 'Official integration nodes', html: `
      <p>The built-in library includes first-pass official nodes for Slack, Discord, SMTP/Gmail SMTP, Google Sheets, Notion, GitHub, Postgres, MySQL, S3/OpenStack-compatible stores, OpenAI, Anthropic, Stripe, and Airtable — plus the spec-driven v2 provider suite (40+ apps) covered on the <a href="nodyra.html#integrations">integrations page</a>.</p>
      <p><code>Postgres Query</code>, <code>MySQL Query</code>, and <code>S3</code> nodes need Python drivers in the selected environment: <code>psycopg[binary]</code>, <code>PyMySQL</code>, and <code>boto3</code> respectively.</p>` },
    { id: 'ai', h: 'AI nodes', html: `
      <p>The canonical AI surface lives in the <code>AI</code> category: <code>AI Prompt Template</code> (Jinja), <code>AI Chat Model</code> (reusable provider/model config), <code>AI Chat</code> (normalized <code>{text, usage, model, finish_reason}</code>), <code>AI Structured Output</code> (JSON Schema validated), the RAG path (<code>AI Text Chunker</code>, <code>AI Batch Embeddings</code>, <code>AI Vector Retriever</code>, <code>AI RAG Answer</code>), <code>AI Map Dataset</code>, <code>AI Simple Memory</code>, and a bounded tool-using <code>AI Agent</code> with separate model/memory/tools ports, visible step logs, and explicit side-effect approval.</p>` }
  ]
},
{
  id: 'architecture', g: 'Understand', title: 'Architecture', gh: 'docs/architecture.md',
  desc: 'A self-hostable, Python-native platform where every node is pure Python. This page maps the components and the execution model.',
  s: [
    { id: 'components', h: 'Components', html: `
      <ul>
        <li><strong>apps/web</strong> — React + React Flow editor (Vite): drag-and-drop canvas, node palette from manifests, inspector with ƒx expression toggle, Environments / Credentials / Activity / Code Library pages, live test-mode over WebSocket.</li>
        <li><strong>apps/api</strong> — FastAPI server: schema, node registry, workflow CRUD with versioning, environments, runs, webhook ingress, credential vault, audit log, auth, Prometheus metrics, artifacts, deployments, retention prune.</li>
        <li><strong>Dispatch worker</strong> — optional standalone execution role (<code>DISPATCH_ROLE=worker</code>): durable-queue dispatch loop plus warm runtime pool. API replicas set <code>DISPATCH_ROLE=disabled</code> and only enqueue. Requires Postgres (SKIP LOCKED leasing) + Redis.</li>
        <li><strong>packages/core</strong> — the engine, node SDK, shared models, typed-value serialization, artifacts helpers. The same engine runs inside the API, inside env subprocesses, and inside exported scripts.</li>
        <li><strong>packages/nodes</strong> — the built-in node library.</li>
        <li><strong>packages/runtime</strong> — in-environment runner: a warm process per env executes graphs inside that env's interpreter.</li>
        <li><strong>packages/exporter</strong> — workflow → <code>.py</code> script and Docker bundle codegen.</li>
      </ul>` },
    { id: 'execution', h: 'Execution model', html: `
      <p>A node has named <strong>input ports</strong> (triggers have none), named <strong>output ports</strong> (most have one named <code>main</code>; branching nodes like <code>if</code> have <code>true</code>/<code>false</code>), and <strong>config parameters</strong> edited in the inspector. Edges connect an upstream output to a downstream input — they never wire individual parameters.</p>
      <p>The engine schedules the graph by <strong>dependency counting</strong>: a node starts the moment all of its in-set predecessors complete, with no level barrier holding a fast branch hostage to a slow sibling. It supports:</p>
      <ul>
        <li>Branching — consumers of an untaken branch are skipped.</li>
        <li>Partial execution — <code>cache</code> supplies precomputed outputs.</li>
        <li>Targeted runs — <code>targets</code> restricts execution to a subset + ancestors.</li>
        <li>Per-node retry, timeout, and log capture (context-local buffers that never cross-capture between concurrent runs).</li>
        <li>Typed output serialization and artifact writes.</li>
        <li>Live events — per-node start/finish with timing.</li>
        <li>Sub-workflows — cycle detection, depth limiting, and inline-child execution when parent and child share an environment.</li>
      </ul>
      ${dcall('info', `<strong>Ordering contract.</strong> Execution order is a function of edges and node insertion order only. Canvas position is never read by the engine — moving nodes around can't change semantics. Among equal-indegree nodes, the branch added first runs first.`)}` },
    { id: 'triggers', h: 'Triggers', html: `
      <ul>
        <li><strong>Manual</strong> — the editor's Run button calls the run dispatch endpoint.</li>
        <li><strong>Webhook</strong> — <code>/webhook/{path}</code> looks up active workflows matching the path, seeds the request as the trigger output, and dispatches. <code>/webhook-test/{path}</code> captures for the editor test panel without executing.</li>
        <li><strong>Schedule</strong> — DB-backed loop checks schedule triggers and active Deployments on a tick and fires due workflows via croniter (real cron). <code>last_fired</code> lives in the DB so restarts don't replay or skip.</li>
        <li><strong>Deployments</strong> — workflow + schedule + default parameters + active flag. Active deployments are the canonical schedule source; in-graph schedule triggers are ignored to avoid double-fire.</li>
      </ul>` },
    { id: 'params', h: 'Parameters, expressions, re-run and retry', html: `
      <ul>
        <li><code>POST /workflows/{id}/run</code> accepts <code>parameters</code>; they seed the trigger node's cache. If no trigger exists, all root nodes are seeded.</li>
        <li>Inspector string fields support <code>{{ $json.field }}</code> and <code>{{ $node["id"].main.field }}</code> expressions.</li>
        <li><code>POST /runs/{run_id}/rerun</code> re-dispatches with the same workflow/version/params.</li>
        <li><code>POST /runs/{run_id}/retry</code> rebuilds the cache from successful upstream outputs and sets targets to the failed node + descendants.</li>
      </ul>` },
    { id: 'storage', h: 'Storage and retention', html: `
      <p>PostgreSQL is the production database; the migrations apply to SQLite too (local dev). Schema migrations cover workflows, versions, environments, runs, node runs, users, credentials, audit events, pinned data, schedule state, deployments, code modules, and artifacts.</p>
      <p>Runs persist forever by default. To keep storage bounded: <code>run_retention_days</code>, <code>run_retention_max_per_workflow</code>, <code>max_output_bytes</code>, <code>max_artifact_bytes</code>, and <code>max_artifacts_per_run</code>. The retention loop is gated on <code>enable_inprocess_scheduler</code> so a multi-API deployment can choose one owner.</p>` },
    { id: 'security', h: 'Security', html: `
      <ul>
        <li>Credentials encrypted at rest (Fernet, key derived from <code>secret_key</code>); the API never returns plaintext.</li>
        <li>Passwords use PBKDF2-HMAC-SHA256; session tokens are HMAC-signed.</li>
        <li>Code-module discovery is AST-only — uploaded Python is never executed in the API process.</li>
        <li>Artifact storage keys are server-generated and path-traversal checked.</li>
        <li>Local-process execution is intentional — workflows run in the operator's trust boundary, the standard self-hosted model. Multi-tenant SaaS requires container or gVisor isolation on top.</li>
      </ul>
      <p>Read the full posture guidance in <a href="#/security">Security model</a>.</p>` }
  ]
},
{
  id: 'status-matrix', g: 'Understand', title: 'Status matrix', gh: 'docs/status-matrix.md',
  desc: 'The live map of what is shipped, beta, experimental, or planned — updated as tasks land, not as marketing promises.',
  s: [
    { id: 'read', h: 'How to read it', html: `
      ${dcall('info', `<strong>Shipped</strong> — implemented, tested, on the default code path. <strong>Beta</strong> — implemented and tested but not yet the default, or behind a flag. <strong>Experimental</strong> — partial. <strong>Scaffolded</strong> — types exist, no live path. <strong>Planned</strong> — designed, no code yet.`)}` },
    { id: 'runtime', h: 'Runtime and queue', html: `
      <table>
        <tr><th>Area</th><th>Status</th></tr>
        <tr><td><code>RUNTIME_MODE</code>, queue/scheduler/webhook/artifact roles + production warnings</td><td>Shipped</td></tr>
        <tr><td>Durable run queue — enqueue / lease / heartbeat / fail / cancel, DB backend</td><td>Shipped</td></tr>
        <tr><td>Dead-letter + replay (<code>/ops/dead-letter</code>)</td><td>Shipped</td></tr>
        <tr><td>Runner leases, heartbeats, offline detection + requeue</td><td>Shipped</td></tr>
        <tr><td>Scheduler leader election (DB advisory lock)</td><td>Shipped</td></tr>
        <tr><td>Pluggable artifact backends (local / S3-compatible)</td><td>Shipped</td></tr>
        <tr><td>Ops dashboard UI (queue depth, capacity, heartbeats)</td><td>Planned</td></tr>
      </table>` },
    { id: 'exec-auth', h: 'Execution and authoring', html: `
      <table>
        <tr><th>Area</th><th>Status</th></tr>
        <tr><td>Topological branch ordering (canvas-layout independent)</td><td>Shipped</td></tr>
        <tr><td>Replay-from-failed-node (<code>/runs/{id}/retry</code> reuses upstream outputs)</td><td>Beta</td></tr>
        <tr><td>Credential test contract (per-type <code>POST /credentials/{id}/test</code>)</td><td>Shipped</td></tr>
        <tr><td>Unsafe-node policy (warn / require approval / block)</td><td>Shipped</td></tr>
        <tr><td>Chat trigger, in-editor chat panel, hosted chat pages with secret links</td><td>Shipped</td></tr>
        <tr><td>API Endpoint node (per-route output handles)</td><td>Shipped</td></tr>
        <tr><td>Node picker quality pass (chips + recents; keyboard palette)</td><td>Beta</td></tr>
        <tr><td>Debug-in-editor (open run snapshot on canvas)</td><td>Planned</td></tr>
      </table>` },
    { id: 'integrations', h: 'Integrations and AI', html: `
      <table>
        <tr><th>Area</th><th>Status</th></tr>
        <tr><td>v2 provider contract (<code>OperationSpec</code>, shared transport/credentials/icons)</td><td>Shipped</td></tr>
        <tr><td>Slack, Stripe v2 — operations + signed event triggers</td><td>Beta</td></tr>
        <tr><td>Notion, Google Sheets, GitHub v2 — operations + polling/webhook triggers</td><td>Beta</td></tr>
        <tr><td>Airtable, Outlook v2 operations; more providers on the <a href="nodyra.html#integrations">integrations page</a></td><td>Beta</td></tr>
        <tr><td>AI chat suppliers (OpenAI-compatible, Azure, Anthropic) + embeddings + Qdrant</td><td>Beta</td></tr>
        <tr><td>Google Drive / Sheets watch-channel trigger renewal</td><td>Planned</td></tr>
      </table>` },
    { id: 'governance', h: 'Governance', html: `
      <ul>
        <li>CI against Postgres + real subprocess runs</li>
        <li>Graceful drain on SIGTERM; migrate-then-start enforced in Compose and Helm</li>
        <li>License + supply-chain scans in CI</li>
        <li><code>SECURITY.md</code>, <code>CONTRIBUTING.md</code>, CLA, PR template, dual license files</li>
      </ul>` }
  ]
},
{
  id: 'deployment', g: 'Self-host', title: 'Deployment', gh: 'docs/deployment.md',
  desc: 'From local development to a production topology on Docker Compose or Kubernetes.',
  s: [
    { id: 'trust', h: 'Trust boundary — read before exposing Nodyra', html: `
      ${dcall('danger', `With the default <code>EXECUTION_SANDBOX=off</code>, workflow Code nodes and uploaded code modules run <strong>arbitrary Python in the worker process on the Nodyra host</strong>. Deploy for <strong>single-tenant, trusted authors</strong> only: put it behind authentication and restrict edit/deploy access to people you trust to run code on the host. To serve untrusted authors, enable sandboxed execution (per-run hardened containers, gVisor where available); multi-tenancy refuses to start without it.`)}` },
    { id: 'dev', h: 'Local development', html: `
      ${dcode('bash', `uv sync --all-packages

# api
DATABASE_URL=sqlite+aiosqlite:///./dev.db \\
  uv run alembic -c apps/api/alembic.ini upgrade head
DATABASE_URL=sqlite+aiosqlite:///./dev.db \\
  uv run uvicorn app.main:app --app-dir apps/api --reload --port 8000

# web
cd apps/web && npm install && npm run dev`)}
      <p>For a full Postgres-backed dev stack, run <code>docker compose -f deploy/docker-compose.yml up postgres redis</code> and swap <code>DATABASE_URL</code> for the Compose Postgres URL.</p>` },
    { id: 'compose', h: 'Docker Compose', html: `
      <p><code>deploy/docker-compose.yml</code> brings up the full stack: Postgres, Redis, the API as a control plane (migrations on startup, <code>DISPATCH_ROLE=control</code>, leader-elected scheduler), a dispatch worker (<code>DISPATCH_ROLE=worker</code>), and the production web build served by nginx.</p>
      ${dcall('warn', `The bundled MinIO is for disposable local development and acceptance. For a public deployment, use the sandbox and external-S3 overlays with an independently provisioned private bucket, HTTPS ingress, and off-host recovery.`)}` },
    { id: 'k8s', h: 'Kubernetes (Helm)', html: `
      <ul>
        <li>Helm chart with separate API, worker, scheduler, and web deployments.</li>
        <li>Pre-install / pre-upgrade migration Job, gated by the deployment encryption key.</li>
        <li>HorizontalPodAutoscaler, PodDisruptionBudget, and NetworkPolicy templates included.</li>
        <li>Set <code>clusterDomain</code> if your cluster differs from <code>cluster.local</code>.</li>
      </ul>` },
    { id: 'checklist', h: 'Production checklist', html: `
      <ul>
        <li>Strong <code>SECRET_KEY</code>, non-empty <code>INTERNAL_API_TOKEN</code>, <code>AUTH_REQUIRED=true</code>.</li>
        <li>External S3 for artifacts; off-host Postgres backups before you rely on it.</li>
        <li>Enable <code>EXECUTION_SANDBOX=auto|required</code> when running AI-generated or untrusted code.</li>
        <li>Set the unsafe-node policy and retention limits.</li>
        <li>HTTPS ingress; keep <code>/mcp</code> behind authentication.</li>
        <li>Wire the Prometheus metrics endpoint into your monitoring.</li>
      </ul>` }
  ]
},
{
  id: 'gitops', g: 'Self-host', title: 'GitOps sync', gh: 'docs/gitops.md',
  desc: 'Sync workflow definitions to a GitHub repository as Python workflow modules. Org-scoped: each org connects one repository, one base directory, and one main branch.',
  s: [
    { id: 'what', h: 'What syncs', html: `
      <ul>
        <li>Workflow graphs export as <code>.py</code> modules — the same format accepted by <code>nodyra workflow import</code>.</li>
        <li>Each workflow reports one of four statuses: <code>synced</code>, <code>pending</code>, <code>conflict</code>, or <code>error</code>.</li>
        <li>Draft changes enqueue a draft push; publishing enqueues a publish push with a publish commit message.</li>
      </ul>
      ${dcall('info', `Git sync does <strong>not</strong> export credentials, secret values, deployments, environments, runner pools, run history, artifacts, users, roles, or workspace settings. Treat the repository as the source for workflow definition modules only.`)}` },
    { id: 'setup', h: 'Setup', html: `
      <p>Create a GitHub token credential in Nodyra first (type <code>github</code>, secret field <code>token</code>, repository contents read/write). Then configure the org-level sync target:</p>
      ${dcode('bash', `curl -X PUT "$NODYRA_BASE_URL/api/github-sync/config" \\
  -H "Authorization: Bearer $NODYRA_TOKEN" \\
  -H "Content-Type: application/json" \\
  -d '{
    "repo": "owner/repo",
    "base_path": "workflows/",
    "main_branch": "main",
    "credential_id": "cred_123"
  }'`)}
      <p>The Settings UI saves repository, base path, and branch; validates access; creates the repository; shows the webhook URL; reveals the webhook secret; and disconnects sync.</p>` },
    { id: 'webhook', h: 'Connect the GitHub webhook', html: `
      ${dcode('bash', `curl "$NODYRA_BASE_URL/api/github-sync/config/webhook-secret" \\
  -H "Authorization: Bearer $NODYRA_TOKEN"`)}
      <p>In GitHub, add a repository webhook pointing at the <code>webhook_url</code> returned by <code>GET /api/github-sync/config</code>, using the returned secret. Pull requests and branch updates now flow back into Nodyra.</p>` }
  ]
},
{
  id: 'licensing', g: 'Project', title: 'Licensing', gh: 'docs/licensing.md',
  desc: 'Nodyra is fair-code: the source is public, self-hosting is free for your own use, and commercial resale or hosting requires a license. Plain-English summary of the binding LICENSE, LICENSE.enterprise, and TRADEMARK.md files.',
  s: [
    { id: 'at-glance', h: 'The three licenses at a glance', html: `
      <table>
        <tr><th>What</th><th>License</th><th>Cost</th></tr>
        <tr><td>Core platform (editor, engine, nodes, API, CLI, MCP)</td><td>Nodyra Sustainable Use License</td><td>Free</td></tr>
        <tr><td>Enterprise features (multi-tenancy, SSO/SAML/OIDC, SCIM, audit export, external KMS, license enforcement)</td><td>Nodyra Enterprise License</td><td>Paid license key</td></tr>
        <tr><td>The Nodyra name and logo</td><td>Trademark policy</td><td>Not licensed with the code</td></tr>
      </table>` },
    { id: 'can', h: 'What you CAN do, free of charge', html: `
      <ul>
        <li>Self-host for your team, company, or personal projects — unlimited internal business use.</li>
        <li>Modify the source and run your modified version internally.</li>
        <li>Build and sell consulting, integration, and support services — as long as each client hosts its own instance and you charge for services, not the software.</li>
        <li>Build and share nodes, integrations, and workflows, including commercially licensed ones.</li>
        <li>Write tutorials, courses, and videos — including paid ones.</li>
        <li>Redistribute unmodified copies free of charge with the license intact.</li>
      </ul>
      <p>The Community posture includes up to five seats, ten active deployments, three environments, one sandboxed runner, and unlimited local drafts. Limits reject new activity without deleting existing workflows, runs, or artifacts.</p>` },
    { id: 'cannot', h: 'What you CANNOT do without a commercial agreement', html: `
      <ul>
        <li>Offer Nodyra (or a derivative) to third parties as a hosted or managed service — SaaS, white-label hosting, or exposing its functionality through your own app or API.</li>
        <li>Sell the software, charge for access to it, or bundle it into a paid product.</li>
        <li>Use, enable, or unlock Enterprise-gated features without a valid license key, or tamper with the license checks.</li>
        <li>Use the Nodyra name or logo for your own product, fork, company, or domain.</li>
      </ul>` },
    { id: 'faq', h: 'FAQ', html: `
      <ul>
        <li><strong>Is Nodyra open source?</strong> Not by the OSI definition — fair-code: source available, free to self-host for permitted uses, commercially protected.</li>
        <li><strong>Do Enterprise features stop working when a license expires?</strong> Licensing soft-fails: expiry downgrades limits to Community and disables gated features for new activity, but never deletes data or stops existing workflows destructively.</li>
        <li><strong>Does the license phone home?</strong> No. License keys are verified offline with an embedded public key — air-gapped deployments are fully supported.</li>
        <li><strong>Who owns contributions?</strong> You keep ownership; the CLA grants the project distribution and relicensing rights.</li>
      </ul>` }
  ]
},
{
  id: 'security', g: 'Project', title: 'Security model', gh: 'SECURITY.md',
  desc: 'Trust boundaries, execution postures, and what Nodyra already protects. Read this before exposing an instance.',
  s: [
    { id: 'postures', h: 'Trust model: three execution postures', html: `
      <ul>
        <li><strong>Trusted single-tenant (default)</strong> — workflow authors are trusted; Code nodes run in warm worker subprocesses on the host at native speed.</li>
        <li><strong>Sandboxed</strong> (<code>EXECUTION_SANDBOX=auto|required</code>) — each run executes in a disposable hardened container.</li>
        <li><strong>Multi-tenant</strong> (<code>MULTI_TENANCY_ENABLED=true</code>) — requires sandboxed execution and combines row-level security, org-scoped keys, quotas/fairness, and per-org sandbox pools.</li>
      </ul>
      ${dcall('danger', `With the default posture, workflow Code nodes and uploaded modules run <strong>arbitrary Python in the worker process on the host</strong> — treat the host as running your team's own code.`)}` },
    { id: 'responsibilities', h: 'Operator responsibilities', html: `
      <ul>
        <li>Require authentication (<code>AUTH_REQUIRED=true</code>) and restrict edit/deploy access via roles (<code>viewer</code> / <code>editor</code> / <code>admin</code> / <code>owner</code>).</li>
        <li>Enable <code>EXECUTION_SANDBOX=auto|required</code> whenever workflows execute AI-generated or otherwise untrusted code.</li>
        <li>Use the unsafe-node policy (<code>UNSAFE_NODE_POLICY=warn|require_approval|block</code>) to gate risky nodes (Code, Execute Command, SSH, SQL-with-expressions, HTTP to private IPs) on deployment activation.</li>
        <li>Set a strong <code>SECRET_KEY</code> and non-empty <code>INTERNAL_API_TOKEN</code> whenever the API is reachable beyond your own machine.</li>
        <li>Keep credentials in the encrypted vault; never paste secrets into Code nodes.</li>
      </ul>` },
    { id: 'builtin', h: 'What Nodyra already does', html: `
      <ul>
        <li>Credentials encrypted at rest (per-credential DEK wrapped by a key derived from <code>SECRET_KEY</code>); the API returns only field names, never plaintext.</li>
        <li>Secret values redacted from run outputs, logs, run events, and API responses.</li>
        <li>Passwords use PBKDF2-HMAC-SHA256; session tokens are HMAC-signed.</li>
        <li>Code-module discovery is AST-only — uploaded Python is parsed, never executed, in the API process.</li>
        <li>Artifact storage keys are server-generated and path-traversal checked.</li>
      </ul>` },
    { id: 'report', h: 'Reporting a vulnerability', html: `
      ${dcall('info', `Report security issues <strong>privately</strong> rather than opening a public issue — email the maintainers with a description, reproduction steps, and impact. Do not include real credentials or customer data in reports.`)}` }
  ]
}
];
var flatOrder = PAGES;
var groupNames = [];
(function () {
  var seen = {};
  PAGES.forEach(function (p) { if (!seen[p.g]) { seen[p.g] = true; groupNames.push(p.g); } });
})();

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function stripTags(s) {
  return s.replace(/<[^>]*>/g, ' ');
}
function hl(text, q) {
  var i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i === -1) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}
function findPage(id) {
  for (var i = 0; i < PAGES.length; i++) if (PAGES[i].id === id) return PAGES[i];
  return null;
}

function buildNav(activeId) {
  var nav = document.getElementById('ds-nav');
  var h = '';
  groupNames.forEach(function (g) {
    h += '<div class="ds-group" data-group="' + esc(g) + '"><div class="ds-group-label">' + esc(g) + '</div>';
    PAGES.forEach(function (p) {
      if (p.g !== g) return;
      h += '<a class="ds-link' + (p.id === activeId ? ' active' : '') + '" href="#/' + p.id + '" data-page="' + p.id + '"><span class="ds-dot" aria-hidden="true"></span>' + esc(p.title) + '</a>';
    });
    h += '</div>';
  });
  nav.innerHTML = h;
}

var tocActive = null;
function spy() {
  var links = document.querySelectorAll('#dtoc-links a[data-sec]');
  if (!links.length) return;
  var current = null;
  links.forEach(function (a) {
    var el = document.getElementById('sec-' + a.getAttribute('data-sec'));
    if (el && el.getBoundingClientRect().top <= 130) current = a.getAttribute('data-sec');
  });
  if (current !== tocActive) {
    tocActive = current;
    links.forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-sec') === current); });
  }
}

function renderPage(p) {
  document.title = p.title + ' — Nodyra Docs';
  var body = document.getElementById('doc-body');
  var h = '';
  h += '<nav class="dcrumb" aria-label="Breadcrumb"><a href="#/welcome">Docs</a><span class="sep">/</span><span class="here">' + esc(p.g) + ' / ' + esc(p.title) + '</span></nav>';
  h += '<h1 class="dpage-title">' + esc(p.title) + '</h1>';
  h += '<p class="dpage-desc">' + p.desc + '</p>';
  var toc = '';
  p.s.forEach(function (s) {
    h += '<section class="dsec" id="sec-' + s.id + '"><h2 id="h-' + s.id + '">' + esc(s.h) + '<a class="hanchor" href="#/' + p.id + '/' + s.id + '" aria-label="Link to this section">#</a></h2>' + s.html + '</section>';
    toc += '<a href="#/' + p.id + '/' + s.id + '" data-sec="' + s.id + '">' + esc(s.h) + '</a>';
  });
  body.innerHTML = h;
  document.getElementById('dtoc-links').innerHTML = toc +
    '<div class="dtoc-edit"><a class="dt-btn" href="https://github.com/Harshit-repo/noodle/blob/main/' + p.gh + '" rel="noopener">Edit on GitHub</a>' +
    '<a class="dt-btn" href="https://github.com/Harshit-repo/noodle/issues" rel="noopener">Report issue</a></div>';
  var idx = flatOrder.indexOf(p);
  var prev = idx > 0 ? flatOrder[idx - 1] : null;
  var next = idx < flatOrder.length - 1 ? flatOrder[idx + 1] : null;
  var pg = '<div class="dpager">';
  pg += prev ? '<a href="#/' + prev.id + '"><span class="dp-dir">← Previous</span><span class="dp-title">' + esc(prev.title) + '</span></a>' : '<span></span>';
  pg += next ? '<a class="dp-next" href="#/' + next.id + '"><span class="dp-dir">Next →</span><span class="dp-title">' + esc(next.title) + '</span></a>' : '<span></span>';
  pg += '</div>';
  body.insertAdjacentHTML('beforeend', pg);
  buildNav(p.id);
  tocActive = null;
  spy();
  window.scrollTo(0, 0);
}

function route() {
  var raw = location.hash.replace(/^#\/?/, '');
  var parts = raw.split('/').filter(Boolean);
  var p = findPage(parts[0]) || findPage('welcome');
  renderPage(p);
  if (parts[1]) {
    setTimeout(function () {
      var el = document.getElementById('sec-' + parts[1]);
      if (el) el.scrollIntoView();
    }, 40);
  }
  closeNav();
}

window.addEventListener('hashchange', route);

document.addEventListener('click', function (e) {
  var btn = e.target.closest('.dcode-copy');
  if (!btn) return;
  var pre = btn.closest('.dcode').querySelector('pre');
  if (!pre) return;
  navigator.clipboard.writeText(pre.textContent).then(function () {
    btn.textContent = 'Copied';
    btn.classList.add('copied');
    setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1600);
  }).catch(function () {});
});

var results = document.getElementById('dt-results');
var input = document.getElementById('dt-search-input');
var selIdx = -1;
var matches = [];

function searchItems(q) {
  q = q.toLowerCase();
  var out = [];
  PAGES.forEach(function (p) {
    var titleHit = p.title.toLowerCase().indexOf(q) !== -1;
    if (titleHit) out.push({ page: p, sub: p.g, html: hl(p.title, q) });
    p.s.forEach(function (s) {
      if (!titleHit && (s.h.toLowerCase().indexOf(q) !== -1 || stripTags(s.html).toLowerCase().indexOf(q) !== -1)) {
        out.push({ page: p, sub: p.g + ' — ' + p.title, html: hl(s.h, q), sec: s.id });
      }
    });
  });
  return out.slice(0, 8);
}
function filterSidebar(q) {
  var show = q.length >= 2;
  document.querySelectorAll('.ds-link').forEach(function (a) {
    var p = a.getAttribute('data-page');
    a.style.display = (!show || p.toLowerCase().indexOf(q) !== -1) ? '' : 'none';
  });
  document.querySelectorAll('.ds-group').forEach(function (g) {
    if (!show) { g.style.display = ''; return; }
    var any = false;
    g.querySelectorAll('.ds-link').forEach(function (a) { if (a.style.display !== 'none') any = true; });
    g.style.display = any ? '' : 'none';
  });
}
function updateSel() {
  document.querySelectorAll('.dr-item').forEach(function (el, i) { el.classList.toggle('sel', i === selIdx); });
}
function go(m) {
  location.hash = '#/' + m.page.id + (m.sec ? '/' + m.sec : '');
  input.value = '';
  results.classList.remove('open');
  filterSidebar('');
  input.blur();
}
input.addEventListener('input', function () {
  var q = input.value.trim();
  selIdx = -1;
  if (q.length < 2) { results.classList.remove('open'); filterSidebar(''); return; }
  matches = searchItems(q);
  filterSidebar(q.toLowerCase());
  if (!matches.length) {
    results.innerHTML = '<div class="dr-empty">No results for “' + esc(q) + '”</div>';
  } else {
    var h = '';
    matches.forEach(function (m, i) {
      h += '<div class="dr-item" data-i="' + i + '" role="option"><span class="dr-title">' + m.html + '</span><span class="dr-sub">' + esc(m.sub) + '</span></div>';
    });
    results.innerHTML = h;
  }
  results.classList.add('open');
});
input.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown' && matches.length) { e.preventDefault(); selIdx = (selIdx + 1) % matches.length; updateSel(); }
  else if (e.key === 'ArrowUp' && matches.length) { e.preventDefault(); selIdx = (selIdx - 1 + matches.length) % matches.length; updateSel(); }
  else if (e.key === 'Enter' && matches.length) { e.preventDefault(); go(matches[Math.max(selIdx, 0)]); }
  else if (e.key === 'Escape') { input.value = ''; results.classList.remove('open'); filterSidebar(''); input.blur(); }
});
results.addEventListener('click', function (e) {
  var item = e.target.closest('.dr-item');
  if (!item) return;
  go(matches[Number(item.getAttribute('data-i'))]);
});
document.addEventListener('click', function (e) {
  if (!e.target.closest('.dt-search')) results.classList.remove('open');
});
document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    input.focus();
    input.select();
  }
});

var burger = document.getElementById('dt-burger');
var overlay = document.getElementById('ds-overlay');
function openNav() { document.body.classList.add('nav-open'); burger.setAttribute('aria-expanded', 'true'); }
function closeNav() { document.body.classList.remove('nav-open'); burger.setAttribute('aria-expanded', 'false'); }
burger.addEventListener('click', function () {
  if (document.body.classList.contains('nav-open')) closeNav(); else openNav();
});
overlay.addEventListener('click', closeNav);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && document.body.classList.contains('nav-open')) closeNav();
});

if (!location.hash) location.replace('#/welcome');
route();
</script>
</body>
</html>
